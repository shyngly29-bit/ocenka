const DEMO_NAMES=['Әлібек Нұрсұлтан','Бекова Айгерім','Жұмабаев Нұрлан','Қасымова Дана','Серікұлы Әлихан','Төлегенова Мадина Ғалымқызы','Үсенов Ерасыл','Ыбырайым Іңкәр'];

/* ---------- template text format ---------- */
function parseTpl(txt){
  const T={topic:'',goal:'',stages:[]},warn=[];let st=null,tk=null,d=null;
  String(txt).split('\n').forEach((raw,i)=>{const l=raw.trim();if(!l)return;let m;
    if(m=l.match(/^(тақырып|тема)\s*:\s*(.*)$/i)){T.topic=m[2].trim();return}
    if(m=l.match(/^(мақсат|цель)\s*:\s*(.*)$/i)){T.goal=m[2].trim();return}
    if(l.startsWith('##')){if(!st){warn.push(`Строка ${i+1}: задание до первого этапа`);return}
      tk={id:uid(),name:l.replace(/^##\s*/,''),descs:[]};st.tasks.push(tk);d=null;return}
    if(l[0]==='#'){const p=l.replace(/^#\s*/,'').split('|').map(s=>s.trim());
      st={id:uid(),short:p[0]||'Этап',name:p[1]||p[0]||'Этап',note:'',tasks:[]};T.stages.push(st);tk=null;d=null;return}
    if(l[0]==='*'){if(st)st.note+=(st.note?'\n':'')+l.replace(/^\*\s*/,'');return}
    if(l[0]==='-'){if(!st){warn.push(`Строка ${i+1}: дескриптор до первого этапа`);return}
      if(!tk){tk={id:uid(),name:'',descs:[]};st.tasks.push(tk)}
      d={id:uid(),t:l.replace(/^-\s*/,''),levels:[],fb:[]};tk.descs.push(d);return}
    if(m=l.match(/^(\d+)\s*[:.)\-–—]\s*(.*)$/)){if(!d){warn.push(`Строка ${i+1}: уровень без дескриптора`);return}
      const v=+m[1];if(!d.levels.some(x=>x.v===v))d.levels.push({v,txt:m[2].trim()});return}
    if(l[0]==='>'){if(d)d.fb.push(l.replace(/^>\s*/,''));return}
    warn.push(`Строка ${i+1} не распознана: «${l.slice(0,40)}»`)});
  T.stages.forEach(s=>s.tasks.forEach(t=>t.descs.forEach(x=>{
    if(!x.levels.length)x.levels=[0,1,2].map(v=>({v,txt:''}));
    if(x.levels.length<2)warn.push(`«${x.t.slice(0,40)}»: нужно хотя бы два уровня`);
    x.levels.sort((a,b)=>a.v-b.v)})));
  if(!T.stages.length)warn.push('Нет ни одного этапа. Этап начинается со строки «# Название»');
  return{T,warn};
}
function serTpl(T){const o=[`Тақырып: ${T.topic||''}`,`Мақсат: ${T.goal||''}`];
  T.stages.forEach(s=>{o.push(`# ${s.short} | ${s.name}`);if(s.note)s.note.split('\n').forEach(n=>o.push('* '+n));
    s.tasks.forEach(t=>{if(t.name)o.push('## '+t.name);t.descs.forEach(d=>{o.push('- '+d.t);
      d.levels.forEach(l=>o.push(`  ${l.v}: ${l.txt}`));d.fb.forEach(f=>o.push('  > '+f))})})});
  return o.join('\n')}

/* ---------- scoring ---------- */
const dmax=d=>Math.max(...d.levels.map(l=>l.v));
const sDescs=s=>s.tasks.flatMap(t=>t.descs);
const sMax=s=>sDescs(s).reduce((a,d)=>a+dmax(d),0);
const scored=(L,s)=>sMax(s)>0&&!L.skip[s.id];
const activeSt=L=>L.stages.filter(s=>scored(L,s));
const lMax=L=>activeSt(L).reduce((a,s)=>a+sMax(s),0);
function stRes(L,sid,s){const m=L.marks[sid]||{};let sum=0,n=0;const ds=sDescs(s);
  ds.forEach(d=>{if(m[d.id]!=null){n++;sum+=m[d.id]}});return{sum,n,all:ds.length,max:sMax(s)}}
function res(L,sid){let sum=0,n=0,all=0;activeSt(L).forEach(s=>{const r=stRes(L,sid,s);sum+=r.sum;n+=r.n;all+=r.all});
  const st=L.absent[sid]?'abs':(!n?'none':n<all?'draft':'done');return{st,sum,n,all,max:lMax(L)}}
const ST_L={none:'Не проверен',draft:'Черновик',done:'Проверен',abs:'Отсутствовал'};
const transfer=(r)=>r.st==='done'?r.sum:'';

/* ---------- storage ---------- */
let D;
function blankDB(){return{v:3,classes:[],lessons:[],templates:[
  {id:uid(),name:'ФО · Физика 9 · Ньютонның бірінші заңы',txt:NEWTON},
  {id:uid(),name:'Бос шаблон · 4 кезең + рефлексия',txt:BLANK}],archive:[],ui:{sort:'list',view:'list'}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Не удалось сохранить: память браузера недоступна')}}
function migrateOld(src){
  if(!src||!src.desc)return false;const cls=src.classes||{'Мой класс':src.students||[]};
  const stages=(src.stages&&src.stages.length)?src.stages:['Баллы'];let added=0;
  Object.keys(cls).forEach(name=>{const arr=(cls[name]||[]).filter(s=>s&&s.n);if(!arr.length)return;
    const c={id:uid(),name,students:arr.map(s=>({id:uid(),n:s.n}))};D.classes.push(c);added++;
    const rows=arr.map(s=>{const per=stages.map((_,k)=>src.desc.reduce((a,d,i)=>a+((d.st||0)===k?((s.c&&s.c[i])||0)*d.p:0),0));
      const raw=per.reduce((a,b)=>a+b,0);return{n:s.n,per,total:src.max?Math.min(src.max,raw):raw}});
    if(rows.some(r=>r.total>0))D.archive.push({id:uid(),cid:c.id,date:today(),label:'Баллы из предыдущей версии (без пересчёта)',stages,rows})});
  return added>0}
function seedDemo(){const c={id:uid(),name:'Пример · 9А',demo:true,students:DEMO_NAMES.map(n=>({id:uid(),n}))};D.classes.push(c);
  const L=makeLesson(c.id,today(),'',{tpl:D.templates[0].id});D.ui.cid=c.id;D.ui.lid=L.id}
function load(){let raw=null;try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(raw&&raw.v===3&&Array.isArray(raw.classes)){D=raw;D.ui=D.ui||{};D.archive=D.archive||[];if(!D.templates||!D.templates.length)D.templates=blankDB().templates;return}
  D=blankDB();let old=null;try{old=JSON.parse(localStorage.getItem('ocenka_v2'))||JSON.parse(localStorage.getItem('ocenka_v1'))}catch(e){}
  if(migrateOld(old)){D.ui.cid=D.classes[0].id;D.ui.migrated=1}else seedDemo();save()}

/* ---------- lessons ---------- */
function makeLesson(cid,date,topic,src){let stages,goal='',tp='';
  if(src.lesson){const s=D.lessons.find(x=>x.id===src.lesson);stages=clone(s.stages);goal=s.goal;tp=s.topic}
  else{const t=D.templates.find(x=>x.id===src.tpl)||D.templates[0];const p=parseTpl(t.txt).T;stages=p.stages;goal=p.goal;tp=p.topic}
  const L={id:uid(),cid,date:date||today(),topic:topic||tp,goal,stages,marks:{},absent:{},fb:{},skip:{},created:Date.now()};
  D.lessons.push(L);return L}
const C=()=>D.classes.find(c=>c.id===D.ui.cid);
const Lz=()=>{const L=D.lessons.find(l=>l.id===D.ui.lid);return L&&L.cid===D.ui.cid?L:null};
const curStage=L=>L&&(L.stages.find(s=>s.id===D.ui.stage)||L.stages.find(s=>scored(L,s))||L.stages[0]);
function fixUi(){if(!C())D.ui.cid=D.classes[0]&&D.classes[0].id;
  if(!Lz()){const ls=D.lessons.filter(l=>l.cid===D.ui.cid).sort((a,b)=>b.created-a.created);D.ui.lid=ls[0]&&ls[0].id}
  const L=Lz();if(L){const s=curStage(L);D.ui.stage=s&&s.id}
  const c=C();if(c&&!c.students.some(s=>s.id===D.ui.sid))D.ui.sid=c.students[0]&&c.students[0].id}
function order(){const c=C();if(!c)return[];const a=c.students.slice();if(D.ui.sort==='az')a.sort((x,y)=>cmp(x.n,y.n));return a}

/* ---------- ui helpers ---------- */
let undoSt=[],openInfo=new Set(),kRow=0,rowIds=[],q='';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2300)}
function modal(html){$('md').innerHTML=html;$('ov').hidden=false;$('md').scrollTop=0}
function closeModal(){$('ov').hidden=true}
function ask(t,m,yes='Да'){return new Promise(r=>{$('qT').textContent=t;$('qM').textContent=m;$('qYes').textContent=yes;$('ovQ').hidden=false;
  $('qYes').onclick=()=>{$('ovQ').hidden=true;r(true)};$('qNo').onclick=()=>{$('ovQ').hidden=true;r(false)}})}

/* ---------- render ---------- */
function render(){fixUi();const c=C(),L=Lz();

  requestAnimationFrame(()=>document.documentElement.style.setProperty('--toph',$('top').offsetHeight+'px'))}
function renderTabs(L){const t=$('tabs');if(!L){t.innerHTML='';return}const c=C(),cur=curStage(L);
  const pres=c.students.filter(s=>!L.absent[s.id]);
  t.innerHTML=L.stages.map(s=>{let sub;
    if(L.skip[s.id])sub='не проводился';else if(!sMax(s))sub='без баллов';
    else{const done=pres.filter(p=>{const r=stRes(L,p.id,s);return r.n===r.all}).length;sub=`✓ ${done}/${pres.length} · ${sMax(s)} б.`}
    return `<button class="tab${s===cur?' on':''}" data-stage="${s.id}" title="${esc(s.name)}"><b>${esc(s.short)}</b><small>${sub}</small></button>`}).join('')}
function renderList(c,L){const el=$('slist');
  if(!c){el.innerHTML='<div class="empty">Создайте класс: ☰ → Классы и списки</div>';return}
  if(!c.students.length){el.innerHTML='<div class="empty">В классе нет учеников.<br><button class="link" data-act="classes">Добавить список</button></div>';return}
  const pos={};c.students.forEach((s,i)=>pos[s.id]=i+1);const cur=L&&curStage(L),qq=q.trim().toLowerCase();
  el.innerHTML=(c.demo?'<div class="demo">Пример с вымышленными учениками. Свой класс: ☰ → Классы и списки.</div>':'')+
   order().filter(s=>!qq||s.n.toLowerCase().includes(qq)).map(s=>{
    let st='none',txt='Нет урока',sg='';
    if(L){const r=res(L,s.id);st=r.st;txt=ST_L[st];
      if(st==='done')sg=`${r.sum}/${r.max}`;else if(st==='draft')txt+=` · ${r.sum}`;
      if(cur&&scored(L,cur)&&st!=='abs'){const sr=stRes(L,s.id,cur);txt+=sr.n===sr.all?' · этап ✓':sr.n?' · этап …':''}}
    return `<button class="srow s-${st}${s.id===D.ui.sid?' on':''}" data-sid="${s.id}"><span class="nm">${pos[s.id]}. ${esc(s.n)}</span><span class="ss"><i class="dot"></i>${txt}</span><span class="sg">${sg}</span></button>`}).join('')
   ||'<div class="empty">Никого не нашли</div>'}
function renderCard(c,L){const el=$('cardcol');rowIds=[];
  if(!c||!L){el.innerHTML=`<div class="panel empty">${c?'Для этого класса ещё нет урока.':'Нет класса.'}<div class="btns" style="justify-content:center"><button class="pri" data-act="${c?'newLesson':'classes'}">${c?'Создать урок':'Создать класс'}</button></div></div>`;return}
  const s=c.students.find(x=>x.id===D.ui.sid);
  if(!s){el.innerHTML='<div class="panel empty">Выберите ученика в списке</div>';return}
  const r=res(L,s.id),cur=curStage(L),abs=!!L.absent[s.id],pos=c.students.indexOf(s)+1;
  const tot=r.st==='abs'?'<small>отсутствовал</small>':`${r.n?r.sum:'—'} <small>из ${r.max}</small>`;
  const zero=r.st==='done'&&r.sum===0;
  const bd=activeSt(L).map(x=>{const sr=stRes(L,s.id,x);
    return `<button class="${x===cur?'on':''}" data-stage="${x.id}">${esc(x.short)} ${sr.n?sr.sum:'—'}/${sr.max}${sr.n&&sr.n<sr.all?` · ${sr.n} из ${sr.all}`:''}</button>`}).join('');
  let body='';
  if(abs)body=`<p class="note">Ученик отмечен как отсутствующий. Отметки сохранены, но в итог не идут.</p>`;
  else if(L.skip[cur.id])body=`<p class="note">Этап отмечен как не проводившийся на этом уроке. Он не входит в максимум и не влияет на статус.</p><button data-act="skip">Вернуть этап</button>`;
  else if(!sMax(cur))body=`<p class="note">Этап без баллов: отметки не ставятся. Можно дать устную обратную связь.</p>`;
  else{const m=L.marks[s.id]||{};
    cur.tasks.forEach(t=>{if(t.name)body+=`<div class="task">${esc(t.name)}</div>`;
      t.descs.forEach(d=>{const v=m[d.id];rowIds.push(d.id);const k=rowIds.length-1;
        body+=`<div class="drow${k===kRow?' kf':''}" data-row="${k}"><div class="dt">${esc(d.t)}
          <button class="link sm" data-info="${d.id}">${openInfo.has(d.id)?'Скрыть уровни':'Уровни'}</button>
          <span class="ds${v!=null?' set':''}">${v!=null?`Отмечено: ${v} из ${dmax(d)}`:'Не отмечено'}</span>
          ${openInfo.has(d.id)?`<div class="lvtxt">${d.levels.map(l=>`<div><b>${l.v}</b> — ${esc(l.txt||'—')}</div>`).join('')}</div>`:''}</div>
          <div class="lvs" role="group" aria-label="Уровень">${d.levels.map(l=>`<button class="lv${v===l.v?' on':''}" data-lv="${d.id}" data-v="${l.v}" aria-pressed="${v===l.v}" title="${esc(l.txt)}">${l.v}</button>`).join('')}
          <button class="clr" data-clr="${d.id}" title="Снять отметку" aria-label="Снять отметку"${v==null?' disabled':''}>×</button></div></div>`})});
    body+=`<div class="btns" style="justify-content:flex-start"><button class="link sm" data-act="skip" style="flex:0 0 auto">Этап не проводился на этом уроке</button></div>`}
  if(kRow>=rowIds.length)kRow=0;
  const phr=abs?[]:sDescs(cur).flatMap(d=>d.fb);
  const fb=L.fb[s.id]||'';
  el.innerHTML=`<div class="panel">
    <div class="chead"><button class="link only-m back" data-act="toList">← Список учеников</button><div class="crow"><div><h2>${pos}. ${esc(s.n)}</h2>
      <span class="chip s-${zero?'zero':r.st}">${zero?'Итог 0 — проверьте':ST_L[r.st]}</span></div><div class="tot">${tot}</div></div>
      <div class="bd">${bd}</div>
      <div class="cact"><button data-act="undo"${undoSt.length?'':' disabled'}>↶ Отменить</button><button data-act="absent">${abs?'Вернуть: присутствует':'Отсутствовал'}</button></div></div>
    <div class="card"><h3 class="stname">${esc(cur.name)}</h3>${cur.note?`<p class="note">${esc(cur.note)}</p>`:''}${body}
      <details class="fbk"${fb?' open':''}><summary>Обратная связь (необязательно)</summary>
        ${phr.length?`<div class="phr">${phr.map((p,i)=>`<button data-ph="${i}">${esc(p)}</button>`).join('')}</div>`:''}
        <textarea id="fbT" rows="2" placeholder="Можно оставить пустым, если обратная связь устная">${esc(fb)}</textarea></details>
    </div></div>
    <div class="nav"><button data-act="prev" aria-label="Предыдущий ученик" style="flex:0 0 52px">←</button>
      <button data-act="nextU">Непроверенный</button><button class="pri" data-act="next">Следующий →</button></div>
    <div class="keys">Клавиши: ↑↓ дескриптор · 0–9 уровень · Del снять · → / N следующий · Shift+N непроверенный · ← предыдущий · [ ] этап · Ctrl+Z отменить · / поиск</div>`;
  el._phr=phr}

/* ---------- actions ---------- */
function setMark(did,v){const L=Lz(),sid=D.ui.sid;const m=L.marks[sid]=L.marks[sid]||{};
  if(m[did]===v)return;undoSt.push({lid:L.id,sid,did,prev:m[did]});m[did]=v;kRow=Math.max(0,rowIds.indexOf(did));save();render()}
function clearMark(did){const L=Lz(),sid=D.ui.sid,m=L.marks[sid];if(!m||m[did]==null)return;
  undoSt.push({lid:L.id,sid,did,prev:m[did]});delete m[did];save();render()}
function undo(){const u=undoSt.pop();if(!u)return toast('Нечего отменять');const L=D.lessons.find(l=>l.id===u.lid);if(!L)return;
  if(u.abs!==undefined){if(u.abs)L.absent[u.sid]=true;else delete L.absent[u.sid]}
  else{const m=L.marks[u.sid]=L.marks[u.sid]||{};if(u.prev==null)delete m[u.did];else m[u.did]=u.prev}
  D.ui.lid=L.id;D.ui.sid=u.sid;save();render();toast('Отменено')}
function go(sid){D.ui.sid=sid;D.ui.view='card';kRow=0;save();render();if(innerWidth<900)scrollTo({top:0})}
function step(d){const o=order();if(!o.length)return;let i=o.findIndex(s=>s.id===D.ui.sid)+d;
  if(i>=o.length){i=0;toast('Конец списка, снова первый ученик')}if(i<0)i=o.length-1;go(o[i].id)}
function nextUnchecked(){const L=Lz();if(!L)return;const s=curStage(L);
  if(!scored(L,s))return toast('На этом этапе нет баллов');const o=order(),i=o.findIndex(x=>x.id===D.ui.sid);
  for(let k=1;k<=o.length;k++){const p=o[(i+k)%o.length];if(L.absent[p.id])continue;const r=stRes(L,p.id,s);if(r.n<r.all){if(p.id===D.ui.sid&&k<o.length)continue;return go(p.id)}}
  toast('Все ученики на этом этапе проверены')}
function setStage(id){D.ui.stage=id;kRow=0;save();render()}

document.addEventListener('click',async e=>{const t=e.target.closest('button,[data-act]');if(!t)return;const ds=t.dataset;
  if(ds.stage)return setStage(ds.stage);
  if(ds.sid)return go(ds.sid);
  if(ds.lv)return setMark(ds.lv,+ds.v);
  if(ds.clr)return clearMark(ds.clr);
  if(ds.info){openInfo.has(ds.info)?openInfo.delete(ds.info):openInfo.add(ds.info);return render()}
  if(ds.ph!=null){const p=$('cardcol')._phr[+ds.ph],ta=$('fbT');ta.value=(ta.value.trim()?ta.value.trim()+' ':'')+p;saveFb();ta.focus();return}
  const a=ds.act;if(!a)return;const L=Lz();
  if(a==='next')step(1);else if(a==='prev')step(-1);else if(a==='nextU')nextUnchecked();
  else if(a==='toList'){D.ui.view='list';save();render()}
  else if(a==='undo')undo();
  else if(a==='absent'){const sid=D.ui.sid;undoSt.push({lid:L.id,sid,abs:!!L.absent[sid]});if(L.absent[sid])delete L.absent[sid];else L.absent[sid]=true;save();render()}
  else if(a==='skip'){const s=curStage(L);if(L.skip[s.id])delete L.skip[s.id];else{if(!await ask('Этап не проводился?',`«${s.name}» не войдёт в максимум и статус у всех учеников этого урока. Уже поставленные отметки сохранятся.`))return;L.skip[s.id]=true}save();render()}
  else if(ACT[a])ACT[a](t)});
let fbT=0;function saveFb(){const L=Lz(),v=$('fbT').value;if(v.trim())L.fb[D.ui.sid]=v;else delete L.fb[D.ui.sid];save()}
document.addEventListener('input',e=>{if(e.target.id==='fbT'){clearTimeout(fbT);fbT=setTimeout(saveFb,400)}
  if(e.target.id==='q'){q=e.target.value;renderList(C(),Lz())}});
$('bSort').onclick=()=>{D.ui.sort=D.ui.sort==='az'?'list':'az';save();render()};

document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
  if(!$('ovQ').hidden||!$('ov').hidden){if(e.key==='Escape'){$('ovQ').hidden?closeModal():$('qNo').click()}return}
  const L=Lz();if(!L)return;const c=e.code,k=e.key;
  if((e.ctrlKey||e.metaKey)&&c==='KeyZ'){e.preventDefault();return undo()}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==='ArrowDown'||k==='ArrowUp'){if(!rowIds.length)return;e.preventDefault();kRow=(kRow+(k==='ArrowDown'?1:-1)+rowIds.length)%rowIds.length;render();
    const r=document.querySelector('.drow.kf');r&&r.scrollIntoView({block:'nearest'});return}
  if(/^Digit\d$|^Numpad\d$/.test(c)){const did=rowIds[kRow];if(!did||L.absent[D.ui.sid])return;const v=+c.slice(-1);
    const d=sDescs(curStage(L)).find(x=>x.id===did);if(d&&d.levels.some(l=>l.v===v))setMark(did,v);else toast('Нет такого уровня');return}
  if(k==='Delete'||k==='Backspace'){const did=rowIds[kRow];if(did){e.preventDefault();clearMark(did)}return}
  if(k==='ArrowRight'||c==='KeyN'){e.preventDefault();return e.shiftKey?nextUnchecked():step(1)}
  if(k==='ArrowLeft'||c==='KeyP'){e.preventDefault();return step(-1)}
  if(c==='BracketLeft'||c==='BracketRight'){const i=L.stages.indexOf(curStage(L))+(c==='BracketRight'?1:-1);if(L.stages[i])setStage(L.stages[i].id);return}
  if(c==='Slash'){e.preventDefault();$('q').focus()}});

ACT.newLesson=()=>{const c=C();if(!c)return ACT.classes();
  const prev=D.lessons.filter(l=>l.cid===c.id).sort((a,b)=>b.created-a.created);
  const opts=D.templates.map(t=>`<option value="t:${t.id}">Шаблон: ${esc(t.name)}</option>`).join('')+
    prev.map(l=>`<option value="l:${l.id}">Копия урока: ${fmtD(l.date)} · ${esc(l.topic||'без темы')}</option>`).join('');
  modal(`<h2>Новый урок · ${esc(c.name)}</h2>
   <label class="fl">Основа урока<select id="nlS">${opts}</select></label>
   <label class="fl">Дата<input type="date" id="nlD" value="${today()}"></label>
   <label class="fl">Тема<input type="text" id="nlT" placeholder="Возьмётся из шаблона, если оставить пустой"></label>
   <p class="mut sm">Новый урок — отдельная запись: прошлые уроки сохраняются в истории. Копия урока переносит этапы, задания и дескрипторы, отметки учеников начинаются с нуля.</p>
   <div class="btns"><button data-act="close">Отмена</button><button class="pri" data-act="nlCreate">Создать урок</button></div>`);
  const fill=()=>{const v=$('nlS').value;let tp='';if(v[0]==='t'){const t=D.templates.find(x=>x.id===v.slice(2));tp=parseTpl(t.txt).T.topic}else{tp=D.lessons.find(x=>x.id===v.slice(2)).topic}$('nlT').value=tp};
  $('nlS').onchange=fill;fill()};
ACT.nlCreate=()=>{const v=$('nlS').value,src=v[0]==='t'?{tpl:v.slice(2)}:{lesson:v.slice(2)};
  const L=makeLesson(D.ui.cid,$('nlD').value,$('nlT').value.trim(),src);D.ui.lid=L.id;D.ui.stage=null;undoSt=[];save();closeModal();render();toast('Урок создан')};

ACT.history=()=>{const c=C();if(!c)return;const ls=D.lessons.filter(l=>l.cid===c.id).sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
  const ar=D.archive.filter(a=>a.cid===c.id);
  modal(`<h2>История · ${esc(c.name)}</h2><div class="mlist">${ls.map(l=>{const cnt={done:0,draft:0};c.students.forEach(s=>{const r=res(l,s.id);if(cnt[r.st]!=null)cnt[r.st]++});
    return `<div class="mitem${l.id===D.ui.lid?' on':''}"><button data-act="openL" data-id="${l.id}">${fmtD(l.date)} · ${esc(l.topic||'без темы')}<br><span class="mut sm">проверено ${cnt.done}, черновиков ${cnt.draft} · максимум ${lMax(l)}</span></button><button data-act="delL" data-id="${l.id}" aria-label="Удалить урок">×</button></div>`}).join('')||'<p class="mut">Уроков пока нет.</p>'}</div>
   ${ar.map(a=>`<h3>${esc(a.label)} · ${fmtD(a.date)}</h3><div class="tw"><table><tr><th>ФИО</th>${a.stages.map(s=>`<th>${esc(s)}</th>`).join('')}<th>Итог</th></tr>${a.rows.map(r=>`<tr><td>${esc(r.n)}</td>${r.per.map(p=>`<td>${p}</td>`).join('')}<td class="sc">${r.total}</td></tr>`).join('')}</table></div>`).join('')}
   <div class="btns"><button data-act="close">Закрыть</button><button class="pri" data-act="newLesson">Новый урок</button></div>`)};
ACT.openL=t=>{D.ui.lid=t.dataset.id;D.ui.stage=null;undoSt=[];save();closeModal();render()};
ACT.delL=async t=>{const l=D.lessons.find(x=>x.id===t.dataset.id);if(!await ask('Удалить урок?',`${fmtD(l.date)} · ${l.topic||'без темы'}. Все отметки этого урока удалятся.`,'Удалить'))return;
  D.lessons=D.lessons.filter(x=>x!==l);save();render();ACT.history()};

/* results */
ACT.results=()=>{const c=C(),L=Lz();if(!c||!L)return toast('Сначала создайте урок');
  const rows=c.students.map((s,i)=>({i:i+1,s,r:res(L,s.id)}));const cnt={none:0,draft:0,done:0,abs:0};rows.forEach(x=>cnt[x.r.st]++);
  const zeros=rows.filter(x=>x.r.st==='done'&&x.r.sum===0).length;
  modal(`<h2>Итоги для BilimClass</h2>
   <div class="sum">${esc(c.name)} · ${fmtD(L.date)} · ${esc(L.topic||'без темы')} · максимум <b>${lMax(L)}</b><br>
   Проверено: <b>${cnt.done}</b> · черновики: <b>${cnt.draft}</b> · не проверены: <b>${cnt.none}</b> · отсутствовали: <b>${cnt.abs}</b>
   ${zeros?`<br><span class="warn">Итог 0 у ${zeros} уч. — проверьте перед переносом.</span>`:''}</div>
   <p class="mut sm">Порядок — как в исходном списке класса. Балл для переноса есть только у проверенных. У черновиков, непроверенных и отсутствующих поле пустое.</p>
   <div class="tw"><table><tr><th>№</th><th>ФИО</th><th>Статус</th><th style="text-align:right">Балл</th></tr>
   ${rows.map(x=>{const z=x.r.st==='done'&&x.r.sum===0;return `<tr class="${x.r.st==='draft'?'r-draft':z?'r-zero':''}"><td>${x.i}</td><td>${esc(x.s.n)}
     <details><summary>по этапам</summary>${activeSt(L).map(s=>{const q=stRes(L,x.s.id,s);return `${esc(s.short)} ${q.n?q.sum:'—'}/${q.max}${q.n&&q.n<q.all?` (${q.n} из ${q.all})`:''}`}).join(' · ')}${L.fb[x.s.id]?`<br><span class="mut">${esc(L.fb[x.s.id])}</span>`:''}</details></td>
     <td>${z?'Проверен · итог 0':ST_L[x.r.st]}${x.r.st==='draft'?` (${x.r.sum} б., ${x.r.n} из ${x.r.all})`:''}</td><td class="sc">${transfer(x.r)}</td></tr>`}).join('')}</table></div>
   <div class="btns"><button data-act="cpRows">Копировать «ФИО + балл»</button><button data-act="cpScores">Копировать баллы столбцом</button><button data-act="xls">Excel</button><button class="pri" data-act="close">Закрыть</button></div>`)};
const resRows=()=>{const c=C(),L=Lz();return c.students.map(s=>({s,r:res(L,s.id)}))};
async function copy(txt){try{await navigator.clipboard.writeText(txt);toast('Скопировано')}catch(e){
  modal(`<h2>Скопируйте вручную</h2><textarea id="cpT" rows="12">${esc(txt)}</textarea><div class="btns"><button class="pri" data-act="results">Назад к итогам</button></div>`);$('cpT').select()}}
ACT.cpRows=()=>copy(resRows().map(x=>`${x.s.n}\t${transfer(x.r)}`).join('\n'));
ACT.cpScores=()=>copy(resRows().map(x=>transfer(x.r)).join('\n'));
let dl=null;(async()=>{try{dl=await window.claude?.use?.('downloads')}catch(e){}})();
async function saveFile(name,data,mime){
  if(dl){try{await dl.save({filename:name,data});toast('Файл сохранён');return true}catch(e){if(e&&e.code!=='declined')toast('Сохранить файл здесь не получилось');return false}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Файл сохранён в «Загрузки»');return true}catch(e){toast('Сохранить файл здесь не получилось');return false}}
ACT.xls=()=>{if(!window.XLSX)return toast('Excel не загрузился: нужен интернет');const c=C(),L=Lz(),st=activeSt(L);
  const aoa=[['Класс',c.name],['Дата',fmtD(L.date)],['Тема',L.topic],['Максимум',lMax(L)],[],
    ['№','ФИО','Статус',...st.map(s=>`${s.short} (из ${sMax(s)})`),'Балл для BilimClass','Сумма (в т.ч. черновик)','Обратная связь']];
  c.students.forEach((s,i)=>{const r=res(L,s.id);aoa.push([i+1,s.n,ST_L[r.st],...st.map(x=>{const q=stRes(L,s.id,x);return q.n?q.sum:''}),transfer(r),r.n?r.sum:'',L.fb[s.id]||''])});
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:5},{wch:32},{wch:14},...st.map(()=>({wch:12})),{wch:12},{wch:12},{wch:40}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Итоги');
  saveFile(`Итоги_${c.name}_${fmtD(L.date)}.xlsx`.replace(/[\\/:*?"<>|]/g,'_'),XLSX.write(wb,{type:'array',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')};

/* classes & import */
ACT.classes=()=>{const c=C();
  modal(`<h2>Классы и списки</h2><div class="mlist">${D.classes.map(k=>`<div class="mitem${k===c?' on':''}"><button data-act="openC" data-id="${k.id}">${esc(k.name)} <span class="mut sm">· ${k.students.length} уч.</span></button><button data-act="delC" data-id="${k.id}" aria-label="Удалить класс">×</button></div>`).join('')}</div>
   <label class="fl" style="margin-top:12px">Новый класс<input type="text" id="cN" placeholder="Например, 9Ә"></label>
   <div class="btns"><button data-act="addC">Создать класс</button>${c?'<button data-act="renC">Переименовать текущий</button>':''}</div>
   ${c?`<h3>Ученики: ${esc(c.name)} (${c.students.length})</h3>
   <div class="btns"><label class="btn">Загрузить Excel / Word<input type="file" id="cF" accept=".xlsx,.xls,.csv,.docx,.txt"></label></div>
   <label class="fl" style="margin-top:10px">Или вставьте список из BilimClass / введите вручную (одно ФИО на строку)<textarea id="cP" rows="6">${esc(c.students.map(s=>s.n).join('\n'))}</textarea></label>
   <div class="btns"><button class="pri" data-act="pvPaste">Предпросмотр</button></div>`:''}
   <div class="btns"><button data-act="close">Закрыть</button></div>`);
  const f=$('cF');if(f)f.onchange=importFile};
ACT.openC=t=>{D.ui.cid=t.dataset.id;D.ui.lid=null;D.ui.stage=null;undoSt=[];save();render();ACT.classes()};
ACT.addC=()=>{const n=$('cN').value.trim();if(!n)return toast('Введите название класса');const k={id:uid(),name:n,students:[]};D.classes.push(k);D.ui.cid=k.id;D.ui.lid=null;save();render();ACT.classes();toast('Класс создан. Добавьте список учеников')};
ACT.renC=()=>{const n=$('cN').value.trim();if(!n)return toast('Впишите новое название в поле «Новый класс»');C().name=n;save();render();ACT.classes()};
ACT.delC=async t=>{const k=D.classes.find(x=>x.id===t.dataset.id);$('ov').hidden=true;
  if(await ask(`Удалить класс «${k.name}»?`,'Список учеников и все уроки этого класса удалятся. Сначала можно сохранить резервную копию.','Удалить')){
    D.classes=D.classes.filter(x=>x!==k);D.lessons=D.lessons.filter(l=>l.cid!==k.id);D.archive=D.archive.filter(a=>a.cid!==k.id);save();render()}ACT.classes()};
const HEAD=/^(№|n|no|фио|ф\.и\.о\.?|имя|ученик|ученики|фамилия|аты-жөні|аты жөні|оқушы|оқушылар|список.*|класс.*|сынып.*)$/i,LET=/[a-zа-яёәіңғүұқөһ]/i;
function clean(arr){const out=[];arr.forEach(x=>{x=String(x).trim().replace(/^\d+[\.\)]?\s*/,'').replace(/\s+/g,' ');
  if(x&&LET.test(x)&&x.length<80&&!HEAD.test(x))out.push(x)});return out}
async function importFile(e){const f=e.target.files[0];if(!f)return;e.target.value='';
  try{let names=[];const ext=f.name.split('.').pop().toLowerCase();
    if(ext==='docx'){if(!window.mammoth)throw 0;names=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value.split('\n')}
    else if(ext==='txt')names=(await f.text()).split('\n');
    else{if(!window.XLSX)throw 0;const wb=XLSX.read(await f.arrayBuffer());
      XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).forEach(r=>{const c=r.find(v=>typeof v==='string'&&LET.test(v)&&!HEAD.test(v.trim()));if(c)names.push(c)})}
    preview(clean(names))}catch(err){toast('Не удалось прочитать файл. Сохраните его как .xlsx или .docx')}}
ACT.pvPaste=()=>preview(clean($('cP').value.split('\n')));
let pending=null;
function preview(names){const c=C();if(!names.length)return toast('Имён не найдено');
  const pool={};c.students.forEach(s=>(pool[s.n]=pool[s.n]||[]).push(s));let same=0;
  const next=names.map(n=>{const p=pool[n];if(p&&p.length){same++;return p.shift()}return{id:uid(),n}});
  const gone=Object.values(pool).flat().length;pending=next;
  modal(`<h2>Предпросмотр · ${esc(c.name)}</h2><div class="sum">Учеников в новом списке: <b>${names.length}</b> · совпали с текущими: <b>${same}</b> · новых: <b>${names.length-same}</b>${gone?` · <span class="warn">уйдут из списка: ${gone}</span> (их отметки в прошлых уроках сохранятся)`:''}</div>
   <p class="mut sm">Порядок строк ниже станет порядком итогов для BilimClass.</p><ol class="pv">${names.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>
   <div class="btns"><button data-act="classes">Назад</button><button class="pri" data-act="pvSave">Сохранить список</button></div>`)}
ACT.pvSave=()=>{const c=C();c.students=pending;delete c.demo;pending=null;save();closeModal();render();toast('Список сохранён')};

/* templates & criteria editor */
let edMode=null;
const HELP=`<details class="sm" style="margin:6px 0"><summary>Как записывать</summary><div class="lvtxt">
<div><b>Тақырып:</b> тема · <b>Мақсат:</b> цель обучения</div>
<div><b># Қысқа | Толық атауы</b> — этап урока (короткое имя для вкладки | полное). Этап без дескрипторов идёт без баллов, например «# Рефлексия».</div>
<div><b>* текст</b> — пояснение к этапу · <b>## Тапсырма</b> — задание</div>
<div><b>- Дескриптор</b> — наблюдаемый результат, ниже уровни: <b>0: …</b>, <b>1: …</b>, <b>2: …</b> (можно только 0 и 1)</div>
<div><b>&gt; фраза</b> — готовая обратная связь к дескриптору</div>
<div>Порядок строк = порядок этапов. Чтобы переставить этап, перенесите его блок.</div></div></details>`;
function edSummary(){const {T,warn}=parseTpl($('edT').value);let tot=0;
  const lines=T.stages.map(s=>{const m=sMax(s);tot+=m;return `${esc(s.short)}: ${m?`<b>${m}</b> б. · ${sDescs(s).length} дескр.`:'без баллов'}`});
  $('edS').innerHTML=`${lines.join('<br>')}<br>Итого за урок: <b>${tot}</b> б.${tot!==10?' <span class="warn">(для ФО обычно 10)</span>':''}${warn.length?`<div class="warn" style="margin-top:6px">${warn.map(esc).join('<br>')}</div>`:''}`}
ACT.templates=(t)=>{const id=(t&&t.dataset&&t.dataset.id)||(edMode&&edMode.tpl)||D.templates[0].id;const tp=D.templates.find(x=>x.id===id)||D.templates[0];edMode={tpl:tp.id};
  modal(`<h2>Шаблоны</h2><label class="fl">Шаблон<select id="edSel">${D.templates.map(x=>`<option value="${x.id}"${x===tp?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
   <label class="fl">Название<input type="text" id="edN" value="${esc(tp.name)}"></label>${HELP}
   <textarea class="ed" id="edT" spellcheck="false">${esc(tp.txt)}</textarea><div class="sum" id="edS"></div>
   <p class="mut sm">Изменения шаблона применяются только к новым урокам. Сохранённые уроки хранят свои критерии.</p>
   <div class="btns"><button data-act="tplDup">Копия как новый шаблон</button><button data-act="tplDel">Удалить шаблон</button><button data-act="close">Закрыть</button><button class="pri" data-act="tplSave">Сохранить</button></div>`);
  $('edSel').onchange=()=>ACT.templates({dataset:{id:$('edSel').value}});$('edT').oninput=edSummary;edSummary()};
ACT.tplSave=()=>{const {T,warn}=parseTpl($('edT').value);if(!T.stages.length)return toast(warn[0]);const tp=D.templates.find(x=>x.id===edMode.tpl);
  tp.name=$('edN').value.trim()||tp.name;tp.txt=$('edT').value;save();toast(warn.length?'Сохранено. Есть замечания':'Шаблон сохранён');ACT.templates({dataset:{id:tp.id}})};
ACT.tplDup=()=>{const n={id:uid(),name:($('edN').value.trim()||'Шаблон')+' (копия)',txt:$('edT').value};D.templates.push(n);save();ACT.templates({dataset:{id:n.id}})};
ACT.tplDel=async()=>{if(D.templates.length<2)return toast('Нужен хотя бы один шаблон');const tp=D.templates.find(x=>x.id===edMode.tpl);$('ov').hidden=true;
  if(await ask('Удалить шаблон?',`«${tp.name}». Уроки, созданные по нему, не изменятся.`,'Удалить')){D.templates=D.templates.filter(x=>x!==tp);edMode=null;save()}ACT.templates()};
ACT.editLesson=()=>{const L=Lz();if(!L)return toast('Сначала создайте урок');
  modal(`<h2>Критерии этого урока</h2><p class="mut sm">Правка касается только урока ${fmtD(L.date)}. Отметки сохраняются у дескрипторов с тем же этапом, заданием и формулировкой.</p>${HELP}
   <textarea class="ed" id="edT" spellcheck="false">${esc(serTpl(L))}</textarea><div class="sum" id="edS"></div>
   <div class="btns"><button data-act="lsToTpl">Сохранить как шаблон</button><button data-act="close">Отмена</button><button class="pri" data-act="lsSave">Применить к уроку</button></div>`);
  $('edT').oninput=edSummary;edSummary()};
ACT.lsSave=()=>{const L=Lz(),{T,warn}=parseTpl($('edT').value);if(!T.stages.length)return toast(warn[0]);
  const key=(s,t,d)=>s.short+'|'+t.name+'|'+d.t,old={},oldSt={};
  L.stages.forEach(s=>{oldSt[s.short]=s.id;s.tasks.forEach(t=>t.descs.forEach(d=>old[key(s,t,d)]=d.id))});
  T.stages.forEach(s=>{if(oldSt[s.short])s.id=oldSt[s.short];s.tasks.forEach(t=>t.descs.forEach(d=>{const o=old[key(s,t,d)];if(o)d.id=o}))});
  L.stages=T.stages;L.topic=T.topic||L.topic;L.goal=T.goal;save();closeModal();render();toast('Критерии урока обновлены')};
ACT.lsToTpl=()=>{const n={id:uid(),name:(Lz().topic||'Урок')+' · шаблон',txt:$('edT').value};D.templates.push(n);save();toast('Шаблон сохранён');ACT.templates({dataset:{id:n.id}})};

/* backup */
ACT.backup=()=>{let t=0;try{t=+localStorage.getItem('ocenka_bak')}catch(e){}
  modal(`<h2>Резервная копия</h2><p class="mut">Один файл со всеми классами, уроками, отметками и шаблонами. Отправьте его себе в WhatsApp или на Google Диск. Так данные можно перенести на другой телефон или восстановить после очистки браузера.</p>
   <p class="mut sm">${t?'Последняя копия: '+new Date(t).toLocaleString('ru-RU'):'Копию ещё не сохраняли.'}</p>
   <div class="btns"><button class="pri" data-act="bakSave">Сохранить копию</button><label class="btn">Восстановить из файла<input type="file" id="bkF" accept=".json,application/json"></label></div>
   <div class="btns"><button data-act="close">Закрыть</button></div>`);$('bkF').onchange=restore};
ACT.bakSave=async()=>{if(await saveFile(`Баллы_копия_${fmtD(today())}.json`,JSON.stringify({app:'ocenka',v:3,data:D}),'application/json')){try{localStorage.setItem('ocenka_bak',Date.now())}catch(e){}}};
async function restore(e){const f=e.target.files[0];if(!f)return;e.target.value='';
  try{const j=JSON.parse(await f.text()),x=j&&j.data;if(!j||j.app!=='ocenka'||!x)throw 0;closeModal();
    if(!await ask('Восстановить из копии?','Текущие данные на этом устройстве заменятся данными из файла.','Восстановить'))return;
    if(x.v===3&&Array.isArray(x.classes)){D=x}else{const keep=D;D=blankDB();if(!migrateOld(x)){D=keep;throw 0}}
    save();render();toast('Данные восстановлены')}catch(err){toast('Это не файл копии «Баллы_копия_….json»')}}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
addEventListener('resize',()=>document.documentElement.style.setProperty('--toph',$('top').offsetHeight+'px'));
load();render();
if(D.ui.migrated===1){D.ui.migrated=2;save();toast('Списки классов перенесены. Старые баллы — в «Истории уроков»')}
</script>

</body>
</html>
