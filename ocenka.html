/* ---------- plan text format ---------- */
const HDR=[['code',/^(оқу мақсатының коды|код)\s*:\s*(.*)$/i],['objective',/^(оқу мақсаты|цель обучения)\s*:\s*(.*)$/i],
  ['goal',/^(сабақтың мақсаты|сабақ мақсаты|мақсат|цель урока|цель)\s*:\s*(.*)$/i],['topic',/^(тақырып|тема)\s*:\s*(.*)$/i]];
const SF=[['time',/^(уақыты?|время)\s*:\s*(.*)$/i],['ped',/^(педагогтің әрекеті)\s*:\s*(.*)$/i],['stud',/^(оқушының әрекеті)\s*:\s*(.*)$/i],
  ['ass',/^(бағалау)\s*:\s*(.*)$/i],['res',/^(ресурстар)\s*:\s*(.*)$/i]];
function parseTpl(txt){
  const T={topic:'',code:'',objective:'',goal:'',stages:[]},warn=[];let st=null,tk=null,d=null;
  String(txt).split('\n').forEach((raw,i)=>{const l=raw.trim();if(!l)return;let m;
    if(l.startsWith('##')){if(!st){warn.push(`${i+1}-жол: тапсырма кезеңнен бұрын тұр`);return}
      const p=l.replace(/^##\s*/,'').split('|').map(s=>s.trim());tk={id:uid(),name:p[0]||'Тапсырма',full:p.slice(1).join(' | '),descs:[]};st.tasks.push(tk);d=null;return}
    if(l[0]==='#'){const p=l.replace(/^#\s*/,'').split('|').map(s=>s.trim());
      st={id:uid(),short:p[0]||'Кезең',name:p[1]||p[0]||'Кезең',time:'',ped:'',stud:'',ass:'',res:'',note:'',tasks:[]};T.stages.push(st);tk=null;d=null;return}
    if(st){for(const [k,re] of SF)if(m=l.match(re)){st[k]=(st[k]?st[k]+'\n':'')+m[2].trim();if(k==='time')st.time=parseInt(m[2])||'';return}}
    for(const [k,re] of HDR)if(!st&&(m=l.match(re))){T[k]=m[2].trim();return}
    if(l[0]==='*'){if(st)st.note+=(st.note?'\n':'')+l.replace(/^\*\s*/,'');return}
    if(l[0]==='-'){if(!st){warn.push(`${i+1}-жол: дескриптор кезеңнен бұрын тұр`);return}
      if(!tk){tk={id:uid(),name:'Тапсырма',full:'',descs:[]};st.tasks.push(tk)}
      d={id:uid(),t:l.replace(/^-\s*/,''),levels:[],fb:[]};tk.descs.push(d);return}
    if(m=l.match(/^(\d+)\s*[:.)\-–—]\s*(.*)$/)){if(!d){warn.push(`${i+1}-жол: деңгей дескрипторсыз тұр`);return}
      const v=+m[1];if(!d.levels.some(x=>x.v===v))d.levels.push({v,txt:m[2].trim()});return}
    if(l[0]==='>'){if(d)d.fb.push(l.replace(/^>\s*/,''));return}
    warn.push(`${i+1}-жол танылмады: «${l.slice(0,40)}»`)});
  T.stages.forEach(s=>s.tasks.forEach(t=>t.descs.forEach(x=>{
    if(!x.levels.length)x.levels=[0,1,2].map(v=>({v,txt:''}));
    if(x.levels.length<2)warn.push(`«${x.t.slice(0,40)}»: кемінде екі деңгей керек`);
    x.levels.sort((a,b)=>a.v-b.v)})));
  if(!T.stages.length)warn.push('Бірде-бір кезең жоқ. Кезең «# Атауы» жолынан басталады');
  return{T,warn};
}
function serTpl(T){const o=[`Тақырып: ${T.topic||''}`,`Оқу мақсатының коды: ${T.code||''}`,`Оқу мақсаты: ${T.objective||''}`,`Сабақтың мақсаты: ${T.goal||''}`];
  const ml=(k,v)=>{if(v!==''&&v!=null)String(v).split('\n').forEach(x=>o.push(`${k}: ${x}`))};
  T.stages.forEach(s=>{o.push(s.short===s.name?`# ${s.name}`:`# ${s.short} | ${s.name}`);ml('Уақыты',s.time);ml('Педагогтің әрекеті',s.ped);ml('Оқушының әрекеті',s.stud);ml('Бағалау',s.ass);ml('Ресурстар',s.res);
    if(s.note)s.note.split('\n').forEach(n=>o.push('* '+n));
    s.tasks.forEach(t=>{o.push('## '+t.name+(t.full?' | '+t.full:''));t.descs.forEach(d=>{o.push('- '+d.t);
      d.levels.forEach(l=>o.push(`  ${l.v}: ${l.txt}`));d.fb.forEach(f=>o.push('  > '+f))})})});
  return o.join('\n')}

/* ---------- scoring ---------- */
const dmax=d=>Math.max(...d.levels.map(l=>l.v));
const tMax=t=>t.descs.reduce((a,d)=>a+dmax(d),0);
const sMax=s=>s.tasks.reduce((a,t)=>a+tMax(t),0);
const tOn=(L,s,t)=>tMax(t)>0&&!L.skip[t.id]&&!L.skip[s.id];
const sTasks=(L,s)=>s.tasks.filter(t=>tOn(L,s,t));
const sActMax=(L,s)=>sTasks(L,s).reduce((a,t)=>a+tMax(t),0);
const lMax=L=>L.stages.reduce((a,s)=>a+sActMax(L,s),0);
function tRes(L,sid,t){const m=L.marks[sid]||{};let sum=0,n=0;t.descs.forEach(d=>{if(m[d.id]!=null){n++;sum+=m[d.id]}});return{sum,n,all:t.descs.length,max:tMax(t)}}
function sRes(L,sid,s){let sum=0,n=0,all=0;sTasks(L,s).forEach(t=>{const r=tRes(L,sid,t);sum+=r.sum;n+=r.n;all+=r.all});return{sum,n,all,max:sActMax(L,s)}}
function res(L,sid){let sum=0,n=0,all=0;L.stages.forEach(s=>{const r=sRes(L,sid,s);sum+=r.sum;n+=r.n;all+=r.all});
  const st=L.absent[sid]?'abs':(!n?'none':n<all?'draft':'done');return{st,sum,n,all,max:lMax(L)}}
const ST_L={none:'Тексерілмеген',draft:'Жоба',done:'Тексерілді',abs:'Келмеді'};
const transfer=r=>r.st==='done'?r.sum:'';

/* ---------- storage ---------- */
let D;
const newTpls=()=>[{id:uid(),name:'ҚМЖ · 9-сынып · Физика · Ньютонның бірінші заңы',txt:NEWTON,kmzh:1},{id:uid(),name:'ҚМЖ · бос шаблон (5/35/5)',txt:BLANK,kmzh:1}];
function blankDB(){return{v:3,kmzh:1,classes:[],lessons:[],templates:newTpls(),archive:[],ui:{sort:'list',view:'list',taskBy:{}}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Сақталмады: браузер жады қолжетімсіз')}}
function migrateOld(src){
  if(!src||!src.desc)return false;const cls=src.classes||{'Менің сыныбым':src.students||[]};
  const stages=(src.stages&&src.stages.length)?src.stages:['Баллдар'];let added=0;
  Object.keys(cls).forEach(name=>{const arr=(cls[name]||[]).filter(s=>s&&s.n);if(!arr.length)return;
    const c={id:uid(),name,students:arr.map(s=>({id:uid(),n:s.n}))};D.classes.push(c);added++;
    const rows=arr.map(s=>{const per=stages.map((_,k)=>src.desc.reduce((a,d,i)=>a+((d.st||0)===k?((s.c&&s.c[i])||0)*d.p:0),0));
      const raw=per.reduce((a,b)=>a+b,0);return{n:s.n,per,total:src.max?Math.min(src.max,raw):raw}});
    if(rows.some(r=>r.total>0))D.archive.push({id:uid(),cid:c.id,date:today(),label:'Алдыңғы нұсқадағы баллдар (қайта есептелмеген)',stages,rows})});
  return added>0}
function seedDemo(){const c={id:uid(),name:'Мысал · 9А',demo:true,students:DEMO_NAMES.map(n=>({id:uid(),n}))};D.classes.push(c);
  const L=makeLesson(c.id,today(),'',{tpl:D.templates[0].id});D.ui.cid=c.id;D.ui.lid=L.id}
function upgrade(){ // v3 (4 stages) → ҚМЖ templates first; old lessons keep their own stages
  if(D.kmzh)return;D.kmzh=1;D.templates.forEach(t=>{if(!/ескі/.test(t.name))t.name+=' (ескі, 4 кезең)'});
  D.templates=[...newTpls(),...D.templates];D.lessons.forEach(L=>L.stages.forEach(s=>s.tasks.forEach(t=>{if(!t.name)t.name='Тапсырма';if(t.full==null)t.full=''})))}
function load(){let raw=null;try{raw=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(raw&&raw.v===3&&Array.isArray(raw.classes)){D=raw;D.ui=D.ui||{};D.ui.taskBy=D.ui.taskBy||{};D.archive=D.archive||[];if(!D.templates||!D.templates.length)D.templates=newTpls();upgrade();save();return}
  D=blankDB();let old=null;try{old=JSON.parse(localStorage.getItem('ocenka_v2'))||JSON.parse(localStorage.getItem('ocenka_v1'))}catch(e){}
  if(migrateOld(old)){D.ui.cid=D.classes[0].id;D.ui.migrated=1}else seedDemo();save()}

/* ---------- lessons ---------- */
function makeLesson(cid,date,topic,src){let P;
  if(src.lesson){const s=D.lessons.find(x=>x.id===src.lesson);P={stages:clone(s.stages),topic:s.topic,code:s.code||'',objective:s.objective||'',goal:s.goal||''}}
  else{const t=D.templates.find(x=>x.id===src.tpl)||D.templates[0];P=parseTpl(t.txt).T}
  const L={id:uid(),cid,date:date||today(),topic:topic||P.topic,code:P.code,objective:P.objective,goal:P.goal,stages:P.stages,marks:{},absent:{},fb:{},skip:{},created:Date.now()};
  D.lessons.push(L);return L}
const C=()=>D.classes.find(c=>c.id===D.ui.cid);
const Lz=()=>{const L=D.lessons.find(l=>l.id===D.ui.lid);return L&&L.cid===D.ui.cid?L:null};
const curStage=L=>L&&(L.stages.find(s=>s.id===D.ui.stage)||L.stages.find(s=>sActMax(L,s)>0)||L.stages[0]);
const curTask=(L,s)=>s&&(s.tasks.find(t=>t.id===D.ui.taskBy[s.id])||s.tasks.find(t=>tOn(L,s,t))||s.tasks[0]);
function fixUi(){D.ui.taskBy=D.ui.taskBy||{};if(!C())D.ui.cid=D.classes[0]&&D.classes[0].id;
  if(!Lz()){const ls=D.lessons.filter(l=>l.cid===D.ui.cid).sort((a,b)=>b.created-a.created);D.ui.lid=ls[0]&&ls[0].id}
  const L=Lz();if(L){const s=curStage(L);D.ui.stage=s&&s.id;const t=curTask(L,s);if(s&&t)D.ui.taskBy[s.id]=t.id}
  const c=C();if(c&&!c.students.some(s=>s.id===D.ui.sid))D.ui.sid=c.students[0]&&c.students[0].id}
function order(){const c=C();if(!c)return[];const a=c.students.slice();if(D.ui.sort==='az')a.sort((x,y)=>cmp(x.n,y.n));return a}

let undoSt=[],openInfo=new Set(),kRow=0,rowIds=[],q='';

  $('bSort').textContent=D.ui.sort==='az'?'А–Я':'Тізім бойынша';$('bSort').title='Жұмыс экранындағы рет. Нәтижелерге әсер етпейді';
  renderTabs(L);renderList(c,L);renderCard(c,L);
  $('main').className='main g '+(D.ui.view==='card'?'v-card':'v-list');
  requestAnimationFrame(()=>document.documentElement.style.setProperty('--toph',$('top').offsetHeight+'px'))}
function progress(L,s,t){const c=C(),pres=c.students.filter(p=>!L.absent[p.id]);
  return{done:pres.filter(p=>{const r=tRes(L,p.id,t);return r.n===r.all}).length,n:pres.length}}
function renderTabs(L){const t=$('tabs'),tk=$('tasks');if(!L){t.innerHTML=tk.innerHTML='';return}const cur=curStage(L);
  t.className='tabs'+(L.stages.length===4?' n4':'');
  t.innerHTML=L.stages.map(s=>{const m=sActMax(L,s);const sub=[s.time?s.time+' мин':'',L.skip[s.id]?'өткізілмеді':m?m+' балл':'баллсыз'].filter(Boolean).join(' · ');
    return `<button class="tab${s===cur?' on':''}" data-stage="${s.id}" aria-pressed="${s===cur}" title="${esc(s.name)}"><b>${esc(s.short)}</b><small>${sub}</small></button>`}).join('');
  const ct=curTask(L,cur);
  tk.innerHTML=cur.tasks.map(x=>{let sub;if(L.skip[x.id]||L.skip[cur.id])sub='өткізілмеді';else if(!tMax(x))sub='баллсыз';else{const p=progress(L,cur,x);sub=`Тексерілді: ${p.done}/${p.n}`}
    return `<button class="tk${x===ct?' on':''}" data-task="${x.id}" aria-pressed="${x===ct}" title="${esc(x.full||x.name)}"><b>${esc(x.name)}</b><small>${sub}</small></button>`}).join('')}
function renderList(c,L){const el=$('slist');
  if(!c){el.innerHTML='<div class="empty">Сынып құрыңыз: ☰ → Сыныптар мен тізімдер</div>';return}
  if(!c.students.length){el.innerHTML='<div class="empty">Сыныпта оқушы жоқ.<br><button class="link" data-act="classes">Тізім қосу</button></div>';return}
  const pos={};c.students.forEach((s,i)=>pos[s.id]=i+1);const s0=L&&curStage(L),t0=L&&curTask(L,s0),qq=q.trim().toLowerCase();
  el.innerHTML=(c.demo?'<div class="demo">Ойдан шығарылған оқушылармен мысал. Өз сыныбыңыз: ☰ → Сыныптар мен тізімдер.</div>':'')+
   order().filter(s=>!qq||s.n.toLowerCase().includes(qq)).map(s=>{

      if(t0&&tOn(L,s0,t0)&&st!=='abs'){const tr=tRes(L,s.id,t0);txt+=tr.n===tr.all?' · тапсырма ✓':tr.n?' · тапсырма …':''}}

   ||'<div class="empty">Ешкім табылмады</div>'}
function renderCard(c,L){const el=$('cardcol');rowIds=[];
  if(!c||!L){el.innerHTML=`<div class="panel empty">${c?'Бұл сыныпта әзірге сабақ жоқ.':'Сынып жоқ.'}<div class="btns" style="justify-content:center"><button class="pri" data-act="${c?'newLesson':'classes'}">${c?'Жаңа сабақ':'Сынып құру'}</button></div></div>`;return}

  if(abs)body+=`<p class="note">Оқушы келмеді деп белгіленген. Белгілер сақталады, бірақ қорытындыға кірмейді.</p>`;
  else if(!t)body+=`<p class="note">Бұл кезеңде тапсырма жоқ.</p>${cur.ped||cur.stud?actions:''}`;
  else if(L.skip[t.id]||L.skip[cur.id])body+=`<p class="note">Бұл тапсырма осы сабақта өткізілмеді деп белгіленген: ол максимумға және мәртебеге кірмейді.</p><button data-act="skip">Тапсырманы қайтару</button>`;
  else if(!tMax(t))body+=`<p class="note">Баллсыз тапсырма: белгі қойылмайды, қорытындыға әсер етпейді.</p>${cur.ped||cur.stud?actions:''}`;
  else{const m=L.marks[s.id]||{};
    t.descs.forEach(d=>{const v=m[d.id];rowIds.push(d.id);const k=rowIds.length-1;
      body+=`<div class="drow${k===kRow?' kf':''}" data-row="${k}"><div class="dt">${esc(d.t)}

/* ---------- actions ---------- */
function setMark(did,v){const L=Lz(),sid=D.ui.sid;const m=L.marks[sid]=L.marks[sid]||{};
  if(m[did]===v)return;undoSt.push({lid:L.id,sid,did,prev:m[did]});m[did]=v;kRow=Math.max(0,rowIds.indexOf(did));save();render()}
function clearMark(did){const L=Lz(),sid=D.ui.sid,m=L.marks[sid];if(!m||m[did]==null)return;
  undoSt.push({lid:L.id,sid,did,prev:m[did]});delete m[did];save();render()}
function undo(){const u=undoSt.pop();if(!u)return toast('Болдыратын әрекет жоқ');const L=D.lessons.find(l=>l.id===u.lid);if(!L)return;
  if(u.abs!==undefined){if(u.abs)L.absent[u.sid]=true;else delete L.absent[u.sid]}
  else{const m=L.marks[u.sid]=L.marks[u.sid]||{};if(u.prev==null)delete m[u.did];else m[u.did]=u.prev}
  D.ui.lid=L.id;D.ui.sid=u.sid;save();render();toast('Болдырылмады')}
function go(sid){D.ui.sid=sid;D.ui.view='card';kRow=0;save();render();if(innerWidth<900)scrollTo({top:0})}
function step(d){const o=order();if(!o.length)return;let i=o.findIndex(s=>s.id===D.ui.sid)+d;
  if(i>=o.length){i=0;toast('Тізім соңы, қайтадан бірінші оқушы')}if(i<0)i=o.length-1;go(o[i].id)}
function nextUnchecked(){const L=Lz();if(!L)return;const s=curStage(L),t=curTask(L,s);
  if(!t||!tOn(L,s,t))return toast('Бұл тапсырмада балл жоқ');const o=order(),i=o.findIndex(x=>x.id===D.ui.sid);
  for(let k=1;k<=o.length;k++){const p=o[(i+k)%o.length];if(L.absent[p.id])continue;const r=tRes(L,p.id,t);if(r.n<r.all)return go(p.id)}
  toast('Бұл тапсырма бойынша барлық оқушы тексерілді')}
function setStage(id){D.ui.stage=id;kRow=0;save();render()}
function setTask(id){const L=Lz();D.ui.taskBy[curStage(L).id]=id;kRow=0;save();render()}

document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;const ds=t.dataset;
  if(ds.stage)return setStage(ds.stage);
  if(ds.task)return setTask(ds.task);
  if(ds.sid)return go(ds.sid);
  if(ds.lv)return setMark(ds.lv,+ds.v);
  if(ds.clr)return clearMark(ds.clr);
  if(ds.info){openInfo.has(ds.info)?openInfo.delete(ds.info):openInfo.add(ds.info);return render()}
  if(ds.ph!=null){const p=$('cardcol')._phr[+ds.ph],ta=$('fbT');ta.value=(ta.value.trim()?ta.value.trim()+' ':'')+p;saveFb();ta.focus();return}
  const a=ds.act;if(!a)return;const L=Lz();
  if(a==='next')step(1);else if(a==='prev')step(-1);else if(a==='nextU')nextUnchecked();
  else if(a==='toList'){D.ui.view='list';save();render()}
  else if(a==='undo')undo();
  else if(a==='absent'){const sid=D.ui.sid;undoSt.push({lid:L.id,sid,abs:!!L.absent[sid]});if(L.absent[sid])delete L.absent[sid];else L.absent[sid]=true;save();render()}
  else if(a==='skip'){const s=curStage(L),tk=curTask(L,s);if(L.skip[tk.id]||L.skip[s.id]){delete L.skip[tk.id];delete L.skip[s.id]}else{if(!await ask('Тапсырма өткізілмеді ме?',`«${tk.name}» осы сабақтың максимумына және барлық оқушының мәртебесіне кірмейді. Қойылған белгілер сақталады.`))return;L.skip[tk.id]=true}save();render()}
  else if(ACT[a])ACT[a](t)});
let fbTm=0;function saveFb(){const L=Lz(),v=$('fbT').value;if(v.trim())L.fb[D.ui.sid]=v;else delete L.fb[D.ui.sid];save()}
document.addEventListener('input',e=>{if(e.target.id==='fbT'){clearTimeout(fbTm);fbTm=setTimeout(saveFb,400)}
  if(e.target.id==='q'){q=e.target.value;renderList(C(),Lz())}});
$('bSort').onclick=()=>{D.ui.sort=D.ui.sort==='az'?'list':'az';save();render()};

document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
  if(!$('ovQ').hidden||!$('ov').hidden){if(e.key==='Escape'){$('ovQ').hidden?closeModal():$('qNo').click()}return}
  const L=Lz();if(!L)return;const c=e.code,k=e.key;
  if((e.ctrlKey||e.metaKey)&&c==='KeyZ'){e.preventDefault();return undo()}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==='ArrowDown'||k==='ArrowUp'){if(!rowIds.length)return;e.preventDefault();kRow=(kRow+(k==='ArrowDown'?1:-1)+rowIds.length)%rowIds.length;render();
    const r=document.querySelector('.drow.kf');r&&r.scrollIntoView({block:'nearest'});return}
  if(/^Digit\d$|^Numpad\d$/.test(c)){const did=rowIds[kRow];if(!did||L.absent[D.ui.sid])return;const v=+c.slice(-1);
    const s=curStage(L),d=curTask(L,s).descs.find(x=>x.id===did);if(d&&d.levels.some(l=>l.v===v))setMark(did,v);else toast('Мұндай деңгей жоқ');return}
  if(k==='Delete'||k==='Backspace'){const did=rowIds[kRow];if(did){e.preventDefault();clearMark(did)}return}
  if(k==='ArrowRight'||c==='KeyN'){e.preventDefault();return e.shiftKey?nextUnchecked():step(1)}
  if(k==='ArrowLeft'||c==='KeyP'){e.preventDefault();return step(-1)}
  if(c==='BracketLeft'||c==='BracketRight'){const i=L.stages.indexOf(curStage(L))+(c==='BracketRight'?1:-1);if(L.stages[i])setStage(L.stages[i].id);return}
  if(c==='Slash'){e.preventDefault();$('q').focus()}});

let dl=null;(async()=>{try{dl=await window.claude?.use?.('downloads')}catch(e){}})();
async function saveFile(name,data,mime){
  if(dl){try{await dl.save({filename:name,data});toast('Файл сақталды');return true}catch(e){if(e&&e.code!=='declined')toast('Мұнда файлды сақтау мүмкін болмады');return false}}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Файл «Жүктеулер» қалтасына сақталды');return true}catch(e){toast('Мұнда файлды сақтау мүмкін болмады');return false}}
ACT.xls=()=>{if(!window.XLSX)return toast('Excel жүктелмеді: интернет керек');const c=C(),L=Lz(),st=L.stages.filter(s=>sActMax(L,s)>0);
  const aoa=[['Сынып',c.name],['Күні',fmtD(L.date)],['Тақырыбы',L.topic],['Максимум',lMax(L)],[],
    ['№','Аты-жөні','Мәртебе',...st.map(s=>`${s.short} (${sActMax(L,s)})`),'BilimClass үшін балл','Жиналған балл (жобаны қоса)','Кері байланыс']];
  c.students.forEach((s,i)=>{const r=res(L,s.id);aoa.push([i+1,s.n,ST_L[r.st],...st.map(x=>{const q=sRes(L,s.id,x);return q.n?q.sum:''}),transfer(r),r.n?r.sum:'',L.fb[s.id]||''])});
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:5},{wch:32},{wch:14},...st.map(()=>({wch:14})),{wch:12},{wch:14},{wch:40}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Нәтижелер');
  saveFile(`Нәтижелер_${c.name}_${fmtD(L.date)}.xlsx`.replace(/[\\/:*?"<>|]/g,'_'),XLSX.write(wb,{type:'array',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')};

/* classes & import */
ACT.classes=()=>{const c=C();
  modal(`<h2>Сыныптар мен тізімдер</h2><div class="mlist">${D.classes.map(k=>`<div class="mitem${k===c?' on':''}"><button data-act="openC" data-id="${k.id}">${esc(k.name)} <span class="mut sm">· ${k.students.length} оқушы</span></button><button data-act="delC" data-id="${k.id}" aria-label="Сыныпты өшіру">×</button></div>`).join('')}</div>
   <label class="fl" style="margin-top:12px">Жаңа сынып<input type="text" id="cN" placeholder="Мысалы, 9Ә"></label>
   <div class="btns"><button data-act="addC">Сынып құру</button>${c?'<button data-act="renC">Ағымдағыны қайта атау</button>':''}</div>
   ${c?`<h3>Оқушылар: ${esc(c.name)} (${c.students.length})</h3>
   <div class="btns"><label class="btn">Excel / Word жүктеу<input type="file" id="cF" accept=".xlsx,.xls,.csv,.docx,.txt"></label></div>
   <label class="fl" style="margin-top:10px">Немесе BilimClass-тан көшірілген тізімді қойыңыз / қолмен жазыңыз (бір жолға бір оқушы)<textarea id="cP" rows="6">${esc(c.students.map(s=>s.n).join('\n'))}</textarea></label>
   <div class="btns"><button class="pri" data-act="pvPaste">Алдын ала қарау</button></div>`:''}
   <div class="btns"><button data-act="close">Жабу</button></div>`);
  const f=$('cF');if(f)f.onchange=importFile};
ACT.openC=t=>{D.ui.cid=t.dataset.id;D.ui.lid=null;D.ui.stage=null;undoSt=[];save();render();ACT.classes()};
ACT.addC=()=>{const n=$('cN').value.trim();if(!n)return toast('Сыныптың атауын жазыңыз');const k={id:uid(),name:n,students:[]};D.classes.push(k);D.ui.cid=k.id;D.ui.lid=null;save();render();ACT.classes();toast('Сынып құрылды. Оқушылар тізімін қосыңыз')};
ACT.renC=()=>{const n=$('cN').value.trim();if(!n)return toast('Жаңа атауды «Жаңа сынып» жолына жазыңыз');C().name=n;save();render();ACT.classes()};
ACT.delC=async t=>{const k=D.classes.find(x=>x.id===t.dataset.id);$('ov').hidden=true;
  if(await ask(`«${k.name}» сыныбын өшіру керек пе?`,'Оқушылар тізімі мен осы сыныптың барлық сабақтары өшеді. Алдымен резервтік көшірме жасауға болады.','Өшіру')){
    D.classes=D.classes.filter(x=>x!==k);D.lessons=D.lessons.filter(l=>l.cid!==k.id);D.archive=D.archive.filter(a=>a.cid!==k.id);save();render()}ACT.classes()};
const HEAD=/^(№|n|no|фио|ф\.и\.о\.?|имя|ученик|ученики|фамилия|аты-жөні|аты жөні|оқушы|оқушылар|список.*|класс.*|сынып.*)$/i,LET=/[a-zа-яёәіңғүұқөһ]/i;
function clean(arr){const out=[];arr.forEach(x=>{x=String(x).trim().replace(/^\d+[\.\)]?\s*/,'').replace(/\s+/g,' ');
  if(x&&LET.test(x)&&x.length<80&&!HEAD.test(x))out.push(x)});return out}
async function importFile(e){const f=e.target.files[0];if(!f)return;e.target.value='';
  try{let names=[];const ext=f.name.split('.').pop().toLowerCase();
    if(ext==='docx'){if(!window.mammoth)throw 0;names=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value.split('\n')}
    else if(ext==='txt')names=(await f.text()).split('\n');
    else{if(!window.XLSX)throw 0;const wb=XLSX.read(await f.arrayBuffer());
      XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).forEach(r=>{const c=r.find(v=>typeof v==='string'&&LET.test(v)&&!HEAD.test(v.trim()));if(c)names.push(c)})}
    preview(clean(names))}catch(err){toast('Файл оқылмады. Оны .xlsx немесе .docx түрінде сақтаңыз')}}
ACT.pvPaste=()=>preview(clean($('cP').value.split('\n')));
let pending=null;
function preview(names){const c=C();if(!names.length)return toast('Аты-жөні табылмады');
  const pool={};c.students.forEach(s=>(pool[s.n]=pool[s.n]||[]).push(s));let same=0;
  const next=names.map(n=>{const p=pool[n];if(p&&p.length){same++;return p.shift()}return{id:uid(),n}});
  const gone=Object.values(pool).flat().length;pending=next;
  const dup=names.filter((n,i)=>names.indexOf(n)!==i).length;
  modal(`<h2>Алдын ала қарау · ${esc(c.name)}</h2><div class="sum">Жаңа тізімде: <b>${names.length}</b> оқушы · бұрынғымен сәйкес: <b>${same}</b> · жаңа: <b>${names.length-same}</b>${gone?` · <span class="warn">тізімнен шығады: ${gone}</span> (өткен сабақтардағы белгілері сақталады)`:''}${dup?`<br><span class="warn">Аты-жөні қайталанатын жолдар: ${dup}. Әрқайсысы жеке оқушы ретінде сақталады.</span>`:''}</div>
   <p class="mut sm">Төмендегі рет BilimClass үшін нәтижелердің реті болады.</p><ol class="pv">${names.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>
   <div class="btns"><button data-act="classes">Артқа</button><button class="pri" data-act="pvSave">Тізімді сақтау</button></div>`)}
ACT.pvSave=()=>{const c=C();c.students=pending;delete c.demo;pending=null;save();closeModal();render();toast('Тізім сақталды')};

/* templates & plan editor */
let edMode=null;
const HELP=`<details class="sm" style="margin:6px 0"><summary>Қалай жазу керек</summary><div class="lvtxt">
<div><b>Тақырып:</b> · <b>Оқу мақсатының коды:</b> · <b>Оқу мақсаты:</b> · <b>Сабақтың мақсаты:</b> — шапка</div>
<div><b># Сабақтың басы</b> — кезең. Астында «САБАҚТЫҢ БАРЫСЫ» кестесінің бағандары: <b>Уақыты: 5</b>, <b>Педагогтің әрекеті:</b>, <b>Оқушының әрекеті:</b>, <b>Бағалау:</b>, <b>Ресурстар:</b></div>
<div><b>## Талқылау | толық сипаттамасы</b> — кезең ішіндегі тапсырма (қысқа атау | толық мәтін)</div>
<div><b>- Дескриптор</b> — бақыланатын нәтиже, астында деңгейлер: <b>0: …</b>, <b>1: …</b>, <b>2: …</b> (тек 0 және 1 де болады)</div>
<div><b>&gt; фраза</b> — дескрипторға дайын кері байланыс</div>
<div>Дескрипторы жоқ тапсырма баллсыз болады (мысалы, рефлексия). Кезеңдердің реті — жолдардың реті.</div></div></details>`;
function edSummary(){const {T,warn}=parseTpl($('edT').value);let tot=0,min=0;
  const lines=T.stages.map(s=>{const m=sMax(s);tot+=m;min+=+s.time||0;return `${esc(s.short)}${s.time?` (${s.time} мин)`:''}: ${m?`<b>${m}</b> балл`:'баллсыз'}${s.tasks.length?' — '+s.tasks.map(t=>`${esc(t.name)} ${tMax(t)||'баллсыз'}`).join(', '):''}`});
  $('edS').innerHTML=`${lines.join('<br>')}<br>Сабаққа барлығы: <b>${tot}</b> балл · <b>${min}</b> мин${tot!==10?' <span class="warn">(ФО үшін әдетте 10)</span>':''}${warn.length?`<div class="warn" style="margin-top:6px">${warn.map(esc).join('<br>')}</div>`:''}`}
ACT.templates=(t)=>{const id=(t&&t.dataset&&t.dataset.id)||(edMode&&edMode.tpl)||D.templates[0].id;const tp=D.templates.find(x=>x.id===id)||D.templates[0];edMode={tpl:tp.id};
  modal(`<h2>Шаблондар</h2><label class="fl">Шаблон<select id="edSel">${D.templates.map(x=>`<option value="${x.id}"${x===tp?' selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
   <label class="fl">Атауы<input type="text" id="edN" value="${esc(tp.name)}"></label>${HELP}
   <textarea class="ed" id="edT" spellcheck="false">${esc(tp.txt)}</textarea><div class="sum" id="edS"></div>
   <p class="mut sm">Шаблондағы өзгеріс тек жаңа сабақтарға қолданылады. Сақталған сабақтар өз критерийлерін сақтайды.</p>
   <div class="btns"><button data-act="tplDup">Жаңа шаблон ретінде көшіру</button><button data-act="tplDel">Шаблонды өшіру</button><button data-act="close">Жабу</button><button class="pri" data-act="tplSave">Сақтау</button></div>`,true);
  $('edSel').onchange=()=>ACT.templates({dataset:{id:$('edSel').value}});$('edT').oninput=edSummary;edSummary()};
ACT.tplSave=()=>{const {T,warn}=parseTpl($('edT').value);if(!T.stages.length)return toast(warn[0]);const tp=D.templates.find(x=>x.id===edMode.tpl);
  tp.name=$('edN').value.trim()||tp.name;tp.txt=$('edT').value;save();toast(warn.length?'Сақталды. Ескертулер бар':'Шаблон сақталды');ACT.templates({dataset:{id:tp.id}})};
ACT.tplDup=()=>{const n={id:uid(),name:($('edN').value.trim()||'Шаблон')+' (көшірме)',txt:$('edT').value};D.templates.push(n);save();ACT.templates({dataset:{id:n.id}})};
ACT.tplDel=async()=>{if(D.templates.length<2)return toast('Кемінде бір шаблон керек');const tp=D.templates.find(x=>x.id===edMode.tpl);$('ov').hidden=true;
  if(await ask('Шаблонды өшіру керек пе?',`«${tp.name}». Осы шаблонмен құрылған сабақтар өзгермейді.`,'Өшіру')){D.templates=D.templates.filter(x=>x!==tp);edMode=null;save()}ACT.templates()};
ACT.editLesson=()=>{const L=Lz();if(!L)return toast('Алдымен сабақ құрыңыз');
  modal(`<h2>Осы сабақтың жоспары мен критерийлері</h2><p class="mut sm">Өзгеріс тек ${fmtD(L.date)} сабағына қатысты. Кезеңі, тапсырмасы және мәтіні сол күйі қалған дескрипторлардың белгілері сақталады.</p>${HELP}
   <textarea class="ed" id="edT" spellcheck="false">${esc(serTpl(L))}</textarea><div class="sum" id="edS"></div>
   <div class="btns"><button data-act="lsToTpl">Шаблон ретінде сақтау</button><button data-act="close">Бас тарту</button><button class="pri" data-act="lsSave">Сабаққа қолдану</button></div>`,true);
  $('edT').oninput=edSummary;edSummary()};
ACT.lsSave=()=>{const L=Lz(),{T,warn}=parseTpl($('edT').value);if(!T.stages.length)return toast(warn[0]);
  const key=(s,t,d)=>s.short+'|'+t.name+'|'+d.t,old={},oldSt={},oldTk={};
  L.stages.forEach(s=>{oldSt[s.short]=s.id;s.tasks.forEach(t=>{oldTk[s.short+'|'+t.name]=t.id;t.descs.forEach(d=>old[key(s,t,d)]=d.id)})});
  T.stages.forEach(s=>{if(oldSt[s.short])s.id=oldSt[s.short];s.tasks.forEach(t=>{const ot=oldTk[s.short+'|'+t.name];if(ot)t.id=ot;t.descs.forEach(d=>{const o=old[key(s,t,d)];if(o)d.id=o})})});
  L.stages=T.stages;L.topic=T.topic||L.topic;L.code=T.code;L.objective=T.objective;L.goal=T.goal;save();closeModal();render();toast('Сабақтың критерийлері жаңартылды')};
ACT.lsToTpl=()=>{const n={id:uid(),name:(Lz().topic||'Сабақ')+' · шаблон',txt:$('edT').value};D.templates.push(n);save();toast('Шаблон сақталды');ACT.templates({dataset:{id:n.id}})};

/* backup */
ACT.backup=()=>{let t=0;try{t=+localStorage.getItem('ocenka_bak')}catch(e){}
  modal(`<h2>Резервтік көшірме</h2><p class="mut">Барлық сынып, сабақ, белгі және шаблон бір файлға сақталады. Файлды WhatsApp-қа немесе Google Drive-қа жіберіп қойыңыз. Сол арқылы деректерді басқа телефонға көшіруге немесе браузер тазаланғаннан кейін қалпына келтіруге болады.</p>
   <p class="mut sm">${t?'Соңғы көшірме: '+new Date(t).toLocaleString('ru-RU'):'Көшірме әлі сақталмаған.'}</p>
   <div class="btns"><button class="pri" data-act="bakSave">Көшірмені сақтау</button><label class="btn">Файлдан қалпына келтіру<input type="file" id="bkF" accept=".json,application/json"></label></div>
   <div class="btns"><button data-act="close">Жабу</button></div>`);$('bkF').onchange=restore};
ACT.bakSave=async()=>{if(await saveFile(`Баллдар_көшірме_${fmtD(today())}.json`,JSON.stringify({app:'ocenka',v:3,data:D}),'application/json')){try{localStorage.setItem('ocenka_bak',Date.now())}catch(e){}}};
async function restore(e){const f=e.target.files[0];if(!f)return;e.target.value='';
  try{const j=JSON.parse(await f.text()),x=j&&j.data;if(!j||j.app!=='ocenka'||!x)throw 0;closeModal();
    if(!await ask('Көшірмеден қалпына келтіру керек пе?','Осы құрылғыдағы деректер файлдағы деректермен ауыстырылады.','Қалпына келтіру'))return;
    if(x.v===3&&Array.isArray(x.classes)){D=x;D.ui=D.ui||{};D.ui.taskBy=D.ui.taskBy||{};upgrade()}else{const keep=D;D=blankDB();if(!migrateOld(x)){D=keep;throw 0}}
    save();render();toast('Деректер қалпына келтірілді')}catch(err){toast('Бұл көшірме файлы емес')}}

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
addEventListener('resize',()=>document.documentElement.style.setProperty('--toph',$('top').offsetHeight+'px'));
load();render();
if(D.ui.migrated===1){D.ui.migrated=2;save();toast('Сынып тізімдері көшірілді. Ескі баллдар — «Сабақтар тарихында»')}
</script>
