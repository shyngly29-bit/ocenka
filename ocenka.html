<script>
const $=id=>document.getElementById(id);
const KEY='ocenka_v3';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fmtD=s=>s?s.split('-').reverse().join('.'):'';
const clone=o=>JSON.parse(JSON.stringify(o));
const cmp=(a,b)=>a.localeCompare(b,['kk','ru']);

const NEWTON=`Тақырып: Ньютонның бірінші заңы
Сабақтың мақсаты: Қорытқы күш нөлге тең болғанда дененің тыныштық күйін немесе бірқалыпты түзу сызықты қозғалысын түсіндіру
# Қайталау | Алдыңғы тақырыпты байланыстыру
Педагогтің әрекеті: Үстелде жатқан кітаптың суретін көрсетіп: «Кітапқа қандай күштер әсер етеді?» деп сұрайды.
Оқушының әрекеті: Алдыңғы тақырыптағы күштерді атайды.
Бағалау: Дескриптор бойынша 2 балл
- Денеге әсер ететін екі күшті атайды
  0: Күштерді атамайды немесе қате атайды
  1: Екі күштің біреуін ғана дұрыс атайды (мысалы, тек ауырлық күшін)
  2: Ауырлық күшін де, тіректің реакция күшін де дұрыс атайды
  > Ауырлық күшін дұрыс атадың. Кітапты үстел де жоғары қарай итереді, бұл қандай күш?
# Жаңа тақырып | Жаңа тақырыпқа өту
Педагогтің әрекеті: «Кітап неге қозғалмай тұр?» деген бағыттаушы сұрақ қояды, болжамдарды тыңдайды.
Оқушының әрекеті: Болжам айтады.
Бағалау: Баллсыз
# Талқылау | Жаңа тақырыпты талқылау
Педагогтің әрекеті: Ньютонның бірінші заңын түсіндіреді, күштердің сызбасын салуды көрсетеді.
Оқушының әрекеті: Жұппен күштердің сызбасын салады, күштердің теңгерілуін талқылайды.
Бағалау: Дескрипторлар бойынша 4 балл
- Күштердің бағытын сызбада көрсетеді
  0: Екі күштің бағыты да қате немесе сызба жоқ
  1: Екі күштің біреуінің бағыты ғана дұрыс көрсетілген
  2: Екі күш те дұрыс бағытта: ауырлық күші төмен, тіректің реакция күші жоғары
  > Ауырлық күшін дұрыс көрсеттің. Енді тіректің реакция күшінің бағытын белгіле.
- Күштердің қорытқысы нөлге тең екенін негіздейді
  0: Негіздемейді немесе қате негіздейді
  1: Күштердің шамасы тең екенін айтады, бірақ бағыттарын ескермейді
  2: Күштердің шамасы тең, бағыттары қарама-қарсы, сондықтан қорытқы күш нөлге тең деп негіздейді
  > Күштердің шамасы тең екенін дұрыс айттың. Енді олардың бағыттарын салыстыр.
# Бекіту | Бекіту
Педагогтің әрекеті: Жаңа мысал береді: мұз бетімен 5 м/с жылдамдықпен сырғанаған шайба, қорытқы күш нөлге тең.
Оқушының әрекеті: Мысалды өз бетінше шешеді.
Бағалау: Дескрипторлар бойынша 4 балл
- Шайбаның қозғалысы қалай жалғасатынын анықтайды

const DEMO_NAMES=['Әлібек Нұрсұлтан','Бекова Айгерім','Жұмабаев Нұрлан','Қасымова Дана','Серікұлы Әлихан','Төлегенова Мадина Ғалымқызы','Үсенов Ерасыл','Ыбырайым Іңкәр'];

/* ---------- plan text format ---------- */
const HDR=[['code',/^(оқу мақсатының коды|код)\s*:\s*(.*)$/i],['objective',/^(оқу мақсаты|цель обучения)\s*:\s*(.*)$/i],
  ['goal',/^(сабақтың мақсаты|сабақ мақсаты|мақсат|цель урока|цель)\s*:\s*(.*)$/i],['topic',/^(тақырып|тема)\s*:\s*(.*)$/i]];
const SF=[['time',/^(уақыты?|время)\s*:\s*(.*)$/i],['ped',/^(педагогтің әрекеті)\s*:\s*(.*)$/i],['stud',/^(оқушының әрекеті)\s*:\s*(.*)$/i],
  ['ass',/^(бағалау)\s*:\s*(.*)$/i],['res',/^(ресурстар)\s*:\s*(.*)$/i]];
function parseTpl(txt){
  const T={topic:'',code:'',objective:'',goal:'',stages:[]},warn=[];let st=null,tk=null,d=null;
  String(txt).split('\n').forEach((raw,i)=>{const l=raw.trim();if(!l)return;let m;
    if(l.startsWith('##')){if(!st){warn.push(`${i+1}-жол: тапсырма кезеңнен бұрын тұр`);return}
      const p=l.replace(/^##\s*/,'').split('|').map(s=>s.trim());tk={id:uid(),name:p[0]||'Тапсырма',full:p.slice(1).join(' | '),descs:[]};st.tasks.push(tk);d=null;return}
    if(l[0]==='#'){const p=l.replace(/^#\s*/,'').split('|').map(s=>s.trim());
      st={id:uid(),short:p[0]||'Кезең',name:p[1]||p[0]||'Кезең',time:'',ped:'',stud:'',ass:'',res:'',note:'',tasks:[]};T.stages.push(st);tk=null;d=null;return}
    if(st){for(const [k,re] of SF)if(m=l.match(re)){st[k]=(st[k]?st[k]+'\n':'')+m[2].trim();if(k==='time')st.time=parseInt(m[2])||'';return}}
    for(const [k,re] of HDR)if(!st&&(m=l.match(re))){T[k]=m[2].trim();return}
    if(l[0]==='*'){if(st)st.note+=(st.note?'\n':'')+l.replace(/^\*\s*/,'');return}
    if(l[0]==='-'){if(!st){warn.push(`${i+1}-жол: дескриптор кезеңнен бұрын тұр`);return}
      if(!tk){tk={id:uid(),name:'Тапсырма',full:'',descs:[]};st.tasks.push(tk)}
      d={id:uid(),t:l.replace(/^-\s*/,''),levels:[],fb:[]};tk.descs.push(d);return}
    if(m=l.match(/^(\d+)\s*[:.)\-–—]\s*(.*)$/)){if(!d){warn.push(`${i+1}-жол: деңгей дескрипторсыз тұр`);return}
      const v=+m[1];if(!d.levels.some(x=>x.v===v))d.levels.push({v,txt:m[2].trim()});return}
    if(l[0]==='>'){if(d)d.fb.push(l.replace(/^>\s*/,''));return}
    warn.push(`${i+1}-жол танылмады: «${l.slice(0,40)}»`)});
  T.stages.forEach(s=>s.tasks.forEach(t=>t.descs.forEach(x=>{
    if(!x.levels.length)x.levels=[0,1,2].map(v=>({v,txt:''}));
    if(x.levels.length<2)warn.push(`«${x.t.slice(0,40)}»: кемінде екі деңгей керек`);
    x.levels.sort((a,b)=>a.v-b.v)})));
  if(!T.stages.length)warn.push('Бірде-бір кезең жоқ. Кезең «# Атауы» жолынан басталады');
  return{T,warn};
}
function serTpl(T){const o=[];const ml=(k,v)=>{if(v!==''&&v!=null)String(v).split('\n').forEach(x=>o.push(`${k}: ${x}`))};
  ml('Тақырып',T.topic);ml('Оқу мақсатының коды',T.code);ml('Оқу мақсаты',T.objective);ml('Сабақтың мақсаты',T.goal);
  T.stages.forEach(s=>{o.push(s.short===s.name?`# ${s.name}`:`# ${s.short} | ${s.name}`);ml('Уақыты',s.time);ml('Педагогтің әрекеті',s.ped);ml('Оқушының әрекеті',s.stud);ml('Бағалау',s.ass);ml('Ресурстар',s.res);
    if(s.note)s.note.split('\n').forEach(n=>o.push('* '+n));
    s.tasks.forEach(t=>{if(s.tasks.length>1||(t.name&&t.name!=='Тапсырма'))o.push('## '+t.name+(t.full?' | '+t.full:''));t.descs.forEach(d=>{o.push('- '+d.t);
      d.levels.forEach(l=>o.push(`  ${l.v}: ${l.txt}`));d.fb.forEach(f=>o.push('  > '+f))})})});
  return o.join('\n')}

/* ---------- scoring ---------- */
const dmax=d=>Math.max(...d.levels.map(l=>l.v));
const tMax=t=>t.descs.reduce((a,d)=>a+dmax(d),0);
const sMax=s=>s.tasks.reduce((a,t)=>a+tMax(t),0);
const tOn=(L,s,t)=>tMax(t)>0&&!L.skip[t.id]&&!L.skip[s.id];
const sTasks=(L,s)=>s.tasks.filter(t=>tOn(L,s,t));
const sActMax=(L,s)=>sTasks(L,s).reduce((a,t)=>a+tMax(t),0);
const lMax=L=>L.stages.reduce((a,s)=>a+sActMax(L,s),0);
function tRes(L,sid,t){const m=L.marks[sid]||{};let sum=0,n=0;t.descs.forEach(d=>{if(m[d.id]!=null){n++;sum+=m[d.id]}});return{sum,n,all:t.descs.length,max:tMax(t)}}
function sRes(L,sid,s){let sum=0,n=0,all=0;sTasks(L,s).forEach(t=>{const r=tRes(L,sid,t);sum+=r.sum;n+=r.n;all+=r.all});return{sum,n,all,max:sActMax(L,s)}}
function res(L,sid){let sum=0,n=0,all=0;L.stages.forEach(s=>{const r=sRes(L,sid,s);sum+=r.sum;n+=r.n;all+=r.all});
  const st=L.absent[sid]?'abs':(!n?'none':n<all?'draft':'done');return{st,sum,n,all,max:lMax(L)}}
const ST_L={none:'Тексерілмеген',draft:'Жоба',done:'Тексерілді',abs:'Келмеді'};
const transfer=r=>r.st==='done'?r.sum:'';

  return added>0}

/* ---------- actions ---------- */
function setMark(did,v){const L=Lz(),sid=D.ui.sid;const m=L.marks[sid]=L.marks[sid]||{};
  const single=isM()&&curTask(L,curStage(L)).descs.length===1;
  if(m[did]===v){if(single){D.ui.view='list';save();render()}return}
  undoSt.push({lid:L.id,sid,did,prev:m[did]});m[did]=v;kRow=Math.max(0,rowIds.indexOf(did));
  if(single)D.ui.view='list';save();render();
  if(single){const c=C(),s=c.students.find(x=>x.id===sid);undoToast(`№ ${c.students.indexOf(s)+1} ${shortN(s.n)}: ${v}`)}}
function undoToast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast utoast';t.setAttribute('role','status');
  t.innerHTML=`<span>${esc(msg)}</span><button data-act="undo">Болдырмау</button>`;document.body.appendChild(t);
  t.addEventListener('click',()=>setTimeout(()=>t.remove(),0));setTimeout(()=>t.remove(),4000)}
function shortN(n){const p=String(n).trim().split(/\s+/);return p.length<2?n:`${p[1]} ${p[0][0]}.`}
function clearMark(did){const L=Lz(),sid=D.ui.sid,m=L.marks[sid];if(!m||m[did]==null)return;
  undoSt.push({lid:L.id,sid,did,prev:m[did]});delete m[did];save();render()}
function undo(){const u=undoSt.pop();if(!u)return toast('Болдыратын әрекет жоқ');const L=D.lessons.find(l=>l.id===u.lid);if(!L)return;
  if(u.abs!==undefined){if(u.abs)L.absent[u.sid]=true;else delete L.absent[u.sid]}
  else{const m=L.marks[u.sid]=L.marks[u.sid]||{};if(u.prev==null)delete m[u.did];else m[u.did]=u.prev}
  D.ui.lid=L.id;D.ui.sid=u.sid;save();render();toast('Болдырылмады')}
function revealRow(){const c=$('slist'),r=c.querySelector('.tile.on');if(!r||isM())return;
  if(r.offsetTop<c.scrollTop||r.offsetTop+r.offsetHeight>c.scrollTop+c.clientHeight)c.scrollTop=r.offsetTop-c.clientHeight/2+r.offsetHeight/2}
function go(sid,reveal){D.ui.sid=sid;D.ui.view='card';kRow=0;save();render();if(isM())$('cardcol').scrollTop=0;else if(reveal)revealRow()}
function step(d){const o=order();if(!o.length)return;let i=o.findIndex(s=>s.id===D.ui.sid)+d;
  if(i>=o.length){i=0;toast('Тізім соңы, қайтадан бірінші оқушы')}if(i<0)i=o.length-1;go(o[i].id,true)}
function nextUnchecked(){const L=Lz();if(!L)return;const s=curStage(L),t=curTask(L,s);
  if(!t||!tOn(L,s,t))return toast('Бұл тапсырмада балл жоқ');const o=order(),i=o.findIndex(x=>x.id===D.ui.sid);
  for(let k=1;k<=o.length;k++){const p=o[(i+k)%o.length];if(L.absent[p.id])continue;const r=tRes(L,p.id,t);if(r.n<r.all)return go(p.id,true)}
  toast('Бұл тапсырма бойынша барлық оқушы тексерілді')}
function setStage(id){D.ui.stage=id;kRow=0;save();render()}

document.addEventListener('click',async e=>{const t=e.target.closest('button');if(!t)return;const ds=t.dataset;
  if(ds.stage)return setStage(ds.stage);
  if(ds.task)return setTask(ds.task);
  if(ds.sid)return go(ds.sid);
  if(ds.lv)return setMark(ds.lv,+ds.v);
  if(ds.clr)return clearMark(ds.clr);
  if(ds.info){openInfo.has(ds.info)?openInfo.delete(ds.info):openInfo.add(ds.info);return render()}
  if(ds.ph!=null){const p=$('cardcol')._phr[+ds.ph],ta=$('fbT');ta.value=(ta.value.trim()?ta.value.trim()+' ':'')+p;saveFb();ta.focus();return}
  const a=ds.act;if(!a)return;const L=Lz();
  if(a==='next')step(1);else if(a==='prev')step(-1);else if(a==='nextU')nextUnchecked();
  else if(a==='toList'){D.ui.view='list';save();render()}
  else if(a==='undo')undo();
  else if(a==='absent'){const sid=D.ui.sid;undoSt.push({lid:L.id,sid,abs:!!L.absent[sid]});if(L.absent[sid])delete L.absent[sid];else L.absent[sid]=true;save();render()}
  else if(a==='skip'){const s=curStage(L),tk=curTask(L,s);if(L.skip[tk.id]||L.skip[s.id]){delete L.skip[tk.id];delete L.skip[s.id]}else{if(!await ask('Тапсырма өткізілмеді ме?',`«${stS(s)}${s.tasks.length>1?' · '+tk.name:''}» осы сабақтың максимумына және барлық оқушының мәртебесіне кірмейді. Қойылған белгілер сақталады.`))return;L.skip[tk.id]=true}save();render()}
  else if(ACT[a])ACT[a](t)});
let fbTm=0;function saveFb(){const L=Lz(),v=$('fbT').value;if(v.trim())L.fb[D.ui.sid]=v;else delete L.fb[D.ui.sid];save()}

document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea,select,[contenteditable="true"]'))return;
  if(!$('ovQ').hidden||!$('ov').hidden){if(e.key==='Escape'){$('ovQ').hidden?closeModal():$('qNo').click()}return}
  if(D.ui.screen==='home')return;const L=Lz();if(!L)return;const c=e.code,k=e.key;
  if((e.ctrlKey||e.metaKey)&&c==='KeyZ'){e.preventDefault();return undo()}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(k==='ArrowDown'||k==='ArrowUp'){if(!rowIds.length)return;e.preventDefault();kRow=(kRow+(k==='ArrowDown'?1:-1)+rowIds.length)%rowIds.length;render();return}
  if(/^Digit\d$|^Numpad\d$/.test(c)){const did=rowIds[kRow];if(!did||L.absent[D.ui.sid])return;const v=+c.slice(-1);
    const d=curTask(L,curStage(L)).descs.find(x=>x.id===did);if(d&&d.levels.some(l=>l.v===v))setMark(did,v);else toast('Мұндай деңгей жоқ');return}
  if(k==='Delete'||k==='Backspace'){const did=rowIds[kRow];if(did){e.preventDefault();clearMark(did)}return}
  if(k==='ArrowRight'||c==='KeyN'){e.preventDefault();return e.shiftKey?nextUnchecked():step(1)}
  if(k==='ArrowLeft'||c==='KeyP'){e.preventDefault();return step(-1)}
  if(c==='BracketLeft'||c==='BracketRight'){const i=L.stages.indexOf(curStage(L))+(c==='BracketRight'?1:-1);if(L.stages[i])setStage(L.stages[i].id);return}
  if(c==='Slash'){e.preventDefault();$('q').focus()}});

async function saveFile(name,data,mime){

  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Файл «Жүктеулер» қалтасына сақталды');return true}catch(e){toast('Мұнда файлды сақтау мүмкін болмады');return false}}

  c.students.forEach((s,i)=>{const r=res(L,s.id);aoa.push([i+1,s.n,ST_L[r.st],...st.map(x=>{const q=sRes(L,s.id,x);return q.n?q.sum:''}),transfer(r),r.n?r.sum:'',L.fb[s.id]||''])});
  aoa.forEach((r,i)=>{if(i<6)r.forEach((c,j)=>{if(typeof c==='string'&&!(i<4&&j===1))r[j]=trS(c)});else r[2]=trS(r[2])});
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:5},{wch:32},{wch:14},...st.map(()=>({wch:14})),{wch:12},{wch:14},{wch:40}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,trS('Нәтижелер'));
  saveFile(`Нәтижелер_${c.name}_${fmtD(L.date)}.xlsx`.replace(/[\\/:*?"<>|]/g,'_'),XLSX.write(wb,{type:'array',bookType:'xlsx'}),'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet')};

const HEAD=/^(№|n|no|фио|ф\.и\.о\.?|имя|ученик|ученики|фамилия|аты-жөні|аты жөні|оқушы|оқушылар|список.*|класс.*|сынып.*)$/i,LET=/[a-zа-яёәіңғүұқөһ]/i;
function clean(arr){const out=[];arr.forEach(x=>{x=String(x).trim().replace(/^\d+[\.\)]?\s*/,'').replace(/\s+/g,' ');
  if(x&&LET.test(x)&&x.length<80&&!HEAD.test(x))out.push(x)});return out}
async function importFile(e){const f=e.target.files[0];if(!f)return;e.target.value='';
  try{let names=[];const ext=f.name.split('.').pop().toLowerCase();
    if(ext==='docx'){if(!window.mammoth)throw 0;names=(await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()})).value.split('\n')}
    else if(ext==='txt')names=(await f.text()).split('\n');
    else{if(!window.XLSX)throw 0;const wb=XLSX.read(await f.arrayBuffer());
      XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''}).forEach(r=>{const c=r.find(v=>typeof v==='string'&&LET.test(v)&&!HEAD.test(v.trim()));if(c)names.push(c)})}
    preview(clean(names))}catch(err){toast('Файл оқылмады. Оны .xlsx немесе .docx түрінде сақтаңыз')}}
ACT.pvPaste=()=>preview(clean($('cP').value.split('\n')));
let pending=null;
function preview(names){const c=C();if(!names.length)return toast('Аты-жөні табылмады');
  const pool={};c.students.forEach(s=>(pool[s.n]=pool[s.n]||[]).push(s));let same=0;
  const next=names.map(n=>{const p=pool[n];if(p&&p.length){same++;return p.shift()}return{id:uid(),n}});
  const gone=Object.values(pool).flat().length;pending=next;
  const dup=names.filter((n,i)=>names.indexOf(n)!==i).length;
  modal(`<h2>Алдын ала қарау · ${esc(c.name)}</h2><div class="sum">Жаңа тізімде: <b>${names.length}</b> оқушы · бұрынғымен сәйкес: <b>${same}</b> · жаңа: <b>${names.length-same}</b>${gone?` · <span class="warn">тізімнен шығады: ${gone}</span> (өткен сабақтардағы белгілері сақталады)`:''}${dup?`<br><span class="warn">Аты-жөні қайталанатын жолдар: ${dup}. Әрқайсысы жеке оқушы ретінде сақталады.</span>`:''}</div>
   <p class="mut sm">Төмендегі рет BilimClass үшін нәтижелердің реті болады.</p><ol class="pv">${names.map(n=>`<li>${esc(n)}</li>`).join('')}</ol>
   <div class="btns"><button data-act="classes">Артқа</button><button class="pri" data-act="pvSave">Тізімді сақтау</button></div>`)}

const TR_SKIP='textarea,script,style,.dtx,.tn,.chd h2,.lvtxt,.phr,.langs';const TR_AT=['placeholder','title','aria-label'];

function trNode(root){if(LANG==='kk'||!root)return;
